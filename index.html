  if (doc.docType === 'policy') return (
    <div className="mt-6 flex flex-wrap items-center gap-3">
      <button onClick={() => onLetter(doc)} className={BTN_BLUE}>{t('letterBtn')}</button>
      <DeadlinePill doc={doc} lang={lang} t={t} />
    </div>
  );
  return (
    <div className="mt-6 rounded-2xl p-4 ring-1 ring-inset ring-[#5e5ce6]/40 bg-gradient-to-br from-[#5e5ce6]/[0.14] to-[#5e5ce6]/[0.03] flex items-start gap-3">
      <span className="w-9 h-9 rounded-xl grid place-items-center bg-[#5e5ce6] text-white shrink-0"><Gavel size={18} /></span>
      <div className="min-w-0">
        <div className={`text-[14px] font-semibold ${T1}`}>{t('shieldTitle')}</div>
        <p className={`text-[13px] mt-0.5 leading-relaxed ${T2}`}>{t('shieldBody')}</p>
        <div className="flex flex-wrap gap-x-4 gap-y-1 mt-1.5">
          {!/data\.gov\.in|myscheme/.test(doc.portal) && <a href={doc.portal} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-[12.5px] font-medium text-[#4b49c9] dark:text-[#a5a4ff]">{t('shieldLink')} · {hostOf(doc.portal)} <ChevronRight size={13} /></a>}
          <a href="https://pgportal.gov.in" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-[12.5px] font-medium text-[#4b49c9] dark:text-[#a5a4ff]">CPGRAMS <ChevronRight size={13} /></a>
        </div>
      </div>
    </div>
  );
}

function LetterModal({ doc, lang, t, toast, onClose }) {
  const name = tx(doc.name, lang);
  const clauses = (doc.documents || []).slice(0, 5).map((c, i) => `${i + 1}. ${c}`).join('\n');
  const [text, setText] = useState(() => t('letterBody').replace(/\{doc\}/g, name).replace('{ministry}', doc.ministry).replace('{clauses}', clauses));
  const copy = async () => { try { await navigator.clipboard.writeText(text); toast(t('letterCopied')); } catch (e) { toast(t('letterHint')); } };
  const subject = encodeURIComponent(t('letterSubject').replace('{doc}', name));
  const full = `mailto:${doc.email || ''}?subject=${subject}&body=${encodeURIComponent(text)}`;
  // very long mail links fail: send the subject only, with the letter on the clipboard
  const href = full.length <= 1900 ? full : `mailto:${doc.email || ''}?subject=${subject}`;
  return (
    <div className="fixed inset-0 z-[60] backdrop-blur-xl bg-black/60 grid place-items-center px-4 fadein" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="w-full max-w-xl max-h-[90vh] overflow-y-auto thin-scroll rounded-[24px] backdrop-blur-3xl bg-white/95 dark:bg-[#16171b]/95 border border-black/10 dark:border-white/[0.16] shadow-[0_30px_90px_rgba(0,0,0,0.9)] p-6 rise" role="dialog" aria-label={t('letterTitle')}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className={`text-[17px] font-semibold ${T1}`}>{t('letterTitle')}</div>
            <div className={`text-[12.5px] mt-0.5 ${T3}`}>{name}</div>
          </div>
          <button onClick={onClose} aria-label="Close" className={`w-7 h-7 rounded-full grid place-items-center shrink-0 ${CHIP} ${T2}`}><X size={14} /></button>
        </div>
        {doc.deadline && !isOpen(doc) && <div className="mt-3 text-[12.5px] leading-relaxed text-[#c27400] dark:text-[#ffb340]">{t('letterLate')}</div>}
        <p className={`mt-3 text-[12.5px] ${T2}`}>{t('letterHint')}</p>
        <textarea value={text} onChange={e => setText(e.target.value)} rows={15} aria-label={t('letterTitle')}
          className={`mt-2 w-full rounded-2xl p-4 text-[13px] leading-relaxed outline-none resize-y focus:ring-2 focus:ring-inset focus:ring-[#0a84ff]/60 ${CHIP} ${T1}`} />
        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={copy} className={BTN_BLUE}><FileText size={14} /> {t('letterCopy')}</button>
          {doc.email
            ? <a href={href} onClick={copy} className={BTN_SOFT}><Send size={14} /> {t('letterEmail')}</a>
            : <a href={doc.portal} target="_blank" rel="noopener noreferrer" className={BTN_SOFT}><External size={14} /> {hostOf(doc.portal)}</a>}
        </div>
        {!doc.email && <p className={`mt-2 text-[11.5px] ${T3}`}>{t('letterNoEmail')}</p>}
      </div>
    </div>
  );
}

function DetailPage({ doc, lang, t, audio, docSrc, checks, setChecks, rules, setRules, trackId, apiKey, onEngine, toast, go, onCategory, onLetter }) {
  const C = CATS[doc.category] || CATS.legal;
  const isScheme = doc.docType === 'scheme';
  const checked = checks[doc.id] || {};
  const readyN = doc.documents.filter((_, i) => checked[i]).length;
  const readyPct = doc.documents.length ? Math.round((readyN / doc.documents.length) * 100) : 0;
  const exclusions = txl(doc.exclusions, lang);
  const isDocAudio = audio.source.key === docSrc.key;
  const cardIcons = bentoFor(doc).icons();

  const wa = buildWhatsApp(doc, lang, t, trackId, checked);
  const onWhatsApp = async () => {
    if (wa.complete) return;
    try {
      await navigator.clipboard.writeText(buildBrief(doc, lang, t, trackId, checked));
      toast(t('waCopied'));
    } catch (e) {
      toast(t('waOpened'));
    }
  };
  const downloadBrief = () => {
    const parts = [
      buildBrief(doc, lang, t, trackId, checked).replace(/\*/g, ''),
      '',
      `${bentoTitle(doc, t, 0)}:`,
      ...txl(doc.benefits, lang).map(s => `- ${s}`),
      '',
      `${bentoTitle(doc, t, 1)}:`,
      ...txl(doc.eligibility, lang).map(s => `- ${s}`),
      ...(exclusions.length ? ['', `${t('exclusions')}:`, ...exclusions.map(s => `- ${s}`)] : []),
      '',
      `${t('dbt')}: ${tx(DBT_TEXT, lang)}`,
      '',
      `Generated by JanSetu AI on ${new Date().toLocaleString()}. Verify all details on the official portal.`,
    ];
    const blob = new Blob(['﻿' + parts.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jansetu-${slug(tx(doc.name, 'en'))}.txt`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(t('briefDl'));
  };

  return (
    <div className="space-y-5">
      <Crumbs doc={doc} lang={lang} t={t} go={go} onCategory={onCategory} trackId={trackId} />

      {/* Scheme banner + voice */}
      <div className="grid grid-cols-1 lg:grid-cols-[1.35fr_1fr] gap-5">
        <div className={`${GLASS} p-6 sm:p-7 relative overflow-hidden`}>
          <div className="absolute -top-24 -right-20 w-72 h-72 rounded-full blur-3xl opacity-25 pointer-events-none" style={{ background: C.color }} />
          <div className="relative">
            <div className="flex flex-wrap items-center gap-2 mb-4">
              <span className="inline-flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1 rounded-full" style={{ background: C.color + '1f', color: C.color }}><C.Icon size={13} />{tx(C.label, lang)}</span>
              <span className="text-[12px] font-semibold px-2.5 py-1 rounded-full" style={{ background: DOC_TYPES[doc.docType].color + '1f', color: DOC_TYPES[doc.docType].color }}>{tx(DOC_TYPES[doc.docType].label, lang)}</span>
              {doc.sample && <span className="text-[11px] font-medium px-2 py-1 rounded-full bg-[#ff453a]/12 text-[#d63a30] dark:text-[#ff6961] inline-flex items-center gap-1"><Info size={11} />{t('sample')}</span>}
              <SourceBadge doc={doc} t={t} />
            </div>
            <h1 className={`text-[28px] sm:text-[36px] font-semibold tracking-[-0.025em] leading-[1.1] ${T1}`}>{tx(doc.name, lang)}</h1>
            <div className="mt-3 flex flex-wrap items-center gap-2 text-[12.5px]">
              <span className={`inline-flex items-center gap-1.5 ${T2}`}><Landmark size={13} />{doc.ministry}</span>
              <a href={doc.portal} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#0a84ff]/10 text-[#0a84ff] font-medium hover:bg-[#0a84ff]/15">
                <BadgeCheck size={13} />{t('registry')} · {hostOf(doc.portal)}
              </a>
              {doc.sourceUrl && <a href={doc.sourceUrl} target="_blank" rel="noopener noreferrer" className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full ${CHIP} ${T2}`}>{t('sourceLabel')} · {hostOf(doc.sourceUrl)}<External size={11} /></a>}
              {doc.src === 'myscheme' && (
                <a href={doc.url} target="_blank" rel="noopener noreferrer" title={t('msOpen')} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-500/12 text-emerald-700 dark:text-[#30d158] font-semibold hover:bg-emerald-500/20">
                  {t('msBadge')}<External size={12} />
                </a>
              )}
            </div>
            {doc.src === 'myscheme' && !doc.msFetched && <p className="mt-2 text-[12px] leading-relaxed text-[#c27400] dark:text-[#ffb340]">{t('msNotRead')}</p>}
            <p className={`mt-4 text-[16px] leading-relaxed ${T2}`}>{tx(doc.summary, lang)}</p>
            {doc.amounts.length > 0 && (
              <div className="flex flex-wrap gap-2 mt-5">
                {doc.amounts.map((a, i) => <span key={i} className={`text-[13px] font-semibold px-3 py-1.5 rounded-xl ${CHIP} ${T1}`}>{a}</span>)}
              </div>
            )}
            <div className="flex flex-wrap gap-2 mt-6">
              <button onClick={() => isDocAudio ? audio.toggle() : audio.loadSource(docSrc, true)} className={BTN_BLUE}>
                <PlayGlyph audio={audio} active={isDocAudio} size={15} /> {isDocAudio && audio.isPlaying ? t('pause') : t('listen')}
              </button>
              <a href={doc.portal} target="_blank" rel="noopener noreferrer" className={BTN_SOFT}><External size={14} /> {t('portal')}</a>
              {doc.helpline && <a href={telHref(doc.helpline)} className={BTN_SOFT}><Phone size={14} /> {doc.helpline}</a>}
            </div>
            {isScheme ? (
            <div className="mt-6 rounded-2xl p-4 ring-1 ring-inset ring-[#30d158]/35 bg-gradient-to-br from-[#30d158]/[0.14] to-[#30d158]/[0.03] flex items-start gap-3">
              <span className="w-9 h-9 rounded-xl grid place-items-center bg-[#30d158] text-white shrink-0 shadow-[0_6px_18px_-6px_rgba(48,209,88,0.8)]"><Shield size={18} /></span>
              <div className="min-w-0">
                <div className={`text-[14px] font-semibold ${T1}`}>{t('zeroFee')}</div>
                <p className={`text-[13px] mt-0.5 leading-relaxed ${T2}`}>{tx(ZERO_FEE, lang)}</p>
                <a href="https://pgportal.gov.in" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 mt-1.5 text-[12.5px] font-medium text-emerald-700 dark:text-[#30d158]">pgportal.gov.in (CPGRAMS) <ChevronRight size={13} /></a>
              </div>
            </div>
            ) : <TypeCallout doc={doc} lang={lang} t={t} onLetter={onLetter} />}
          </div>
        </div>
        <VoiceCard audio={audio} t={t} lang={lang} docKey={docSrc.key} />
      </div>

      {doc.trace && <TraceCard doc={doc} t={t} />}

      {/* 4-card adaptive Bento grid */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div className={`${GLASS} p-5`}>
          <CardHead Icon={cardIcons[0]} title={bentoTitle(doc, t, 0)} color="#30d158" />
          {doc.amounts.length > 0 && <div className="flex flex-wrap gap-1.5 -mt-1 mb-3">{doc.amounts.slice(0, 3).map((a, i) => <span key={i} className="text-[11.5px] font-semibold px-2 py-1 rounded-lg bg-emerald-500/12 text-emerald-700 dark:text-[#30d158]">{a}</span>)}{isScheme && <span className={`text-[11.5px] font-semibold px-2 py-1 rounded-lg ${CHIP} ${T2}`}>DBT</span>}</div>}
          <ul className="space-y-2.5">
            {txl(doc.benefits, lang).map((b, i) => (
              <li key={i} className="flex gap-3"><span className="mt-[3px] w-5 h-5 rounded-full grid place-items-center bg-emerald-500/15 text-emerald-600 dark:text-[#30d158] shrink-0"><Check size={12} strokeWidth={3} /></span><span className={`text-[14px] leading-relaxed ${T1}`}>{b}</span></li>
            ))}
          </ul>
        </div>
        <div className={`${GLASS} p-5`}>
          <CardHead Icon={cardIcons[1]} title={bentoTitle(doc, t, 1)} color="#0a84ff" />
          <ul className="space-y-2.5">
            {txl(doc.eligibility, lang).map((b, i) => (
              <li key={i} className="flex gap-3"><span className="mt-[3px] w-5 h-5 rounded-full grid place-items-center bg-[#0a84ff]/15 text-[#0a84ff] text-[11px] font-bold shrink-0">{i + 1}</span><span className={`text-[14px] leading-relaxed ${T1}`}>{b}</span></li>
            ))}
          </ul>
          {exclusions.length > 0 && (
            <div className="mt-4 pt-4 border-t border-black/[0.06] dark:border-white/[0.08]">
              <div className="text-[11px] font-semibold uppercase tracking-[0.08em] text-[#d63a30] dark:text-[#ff6961] mb-2">{t('exclusions')}</div>
              <ul className="space-y-1.5">{exclusions.map((x, i) => <li key={i} className={`text-[13px] flex gap-2 ${T2}`}><X size={13} className="mt-1 shrink-0 text-[#ff453a]" />{x}</li>)}</ul>
            </div>
          )}
        </div>
        <div className={`${GLASS} p-5`}>
          <CardHead Icon={cardIcons[2]} title={bentoTitle(doc, t, 2)} color="#ff9f0a" right={<span className={`text-[12px] font-semibold tabular-nums ${readyPct === 100 ? 'text-emerald-600 dark:text-[#30d158]' : T2}`}>{readyPct}% {t('ready')}</span>} />
          <div className="h-1.5 rounded-full bg-black/[0.06] dark:bg-white/[0.08] overflow-hidden mb-4">
            <div className="h-full rounded-full transition-all duration-500" style={{ width: readyPct + '%', background: readyPct === 100 ? '#30d158' : '#ff9f0a' }} />
          </div>
          <div className="space-y-1">
            {doc.documents.map((d, i) => (
              <button key={i} onClick={() => setChecks(c => ({ ...c, [doc.id]: { ...(c[doc.id] || {}), [i]: !checked[i] } }))}
                className="w-full flex items-center gap-3 px-2 py-2 rounded-xl text-left hover:bg-black/[0.03] dark:hover:bg-white/[0.04] transition">
                <span className={`w-[22px] h-[22px] rounded-full grid place-items-center border-2 transition shrink-0 ${checked[i] ? 'bg-[#ff9f0a] border-[#ff9f0a] text-white' : 'border-black/20 dark:border-white/25'}`}>{checked[i] && <Check size={13} strokeWidth={3} />}</span>
                <span className={`text-[14px] ${checked[i] ? `${T3} line-through` : T1}`}>{d}</span>
              </button>
            ))}
          </div>
        </div>
        <div className={`${GLASS} p-5`}>
          <CardHead Icon={cardIcons[3]} title={bentoTitle(doc, t, 3)} color="#5e5ce6" />
          {(doc.docType === 'notification' || doc.docType === 'policy') && <div className="-mt-1 mb-3"><DeadlinePill doc={doc} lang={lang} t={t} small /></div>}

          <ol className="relative">
            {txl(doc.steps, lang).map((s, i, arr) => (
              <li key={i} className="flex gap-3 pb-4 last:pb-0 relative">
                {i < arr.length - 1 && <span className="absolute left-[11px] top-7 bottom-0 w-px bg-black/10 dark:bg-white/[0.12]" />}
                <span className="w-6 h-6 rounded-full grid place-items-center bg-[#5e5ce6] text-white text-[11px] font-bold shrink-0 z-[1]">{i + 1}</span>
                <span className={`text-[14px] leading-relaxed pt-0.5 ${T1}`}>{s}</span>
              </li>
            ))}
          </ol>
          <div className="mt-4 pt-4 border-t border-black/[0.06] dark:border-white/[0.08]">
            <div className={`text-[11px] font-semibold uppercase tracking-[0.08em] mb-2 ${T3}`}>{t('verified')}</div>
            <div className="flex flex-wrap gap-1.5">
              {[{ label: hostOf(doc.portal), url: doc.portal }, ...VERIFIED_LINKS.filter(l => !doc.portal.includes(l.label))].map(l => (
                <a key={l.url} href={l.url} target="_blank" rel="noopener noreferrer" className={`inline-flex items-center gap-1 text-[12px] font-medium px-2.5 py-1 rounded-full ${CHIP} text-[#0a84ff] hover:bg-[#0a84ff]/10`}><Lock size={10} />{l.label}</a>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Do I qualify? + Q&A copilot */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
        <RuleSimulator doc={doc} lang={lang} t={t} rules={rules} setRules={setRules} />
        <QAAssistant doc={doc} lang={lang} t={t} apiKey={apiKey} audio={audio} onEngine={onEngine} />
      </div>

      {/* Last-mile delivery + DBT */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div className={`${GLASS} p-5`}>
          <CardHead Icon={Send} title={t('lastMile')} color="#0a84ff" right={<span className={`text-[12px] font-mono font-semibold px-2 py-1 rounded-lg ${CHIP} ${T1}`}>{trackId}</span>} />
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <a href={waHref(wa.text)} target="_blank" rel="noopener noreferrer" onClick={onWhatsApp} className={`${BTN} py-3 bg-[#25D366] text-white hover:bg-[#22c35e] shadow-[0_8px_22px_-8px_rgba(37,211,102,0.8)]`}><MessageCircle size={16} /> {t('whatsapp')}</a>
            <button onClick={downloadBrief} className={`${BTN_SOFT} !py-3`}><Download size={16} /> {t('offline')}</button>
          </div>
          <p className={`text-[11.5px] mt-3 ${T3}`}>{t('trackId')} · {bentoTitle(doc, t, 2)}: {readyN}/{doc.documents.length}</p>
        </div>
        {isScheme && (
        <div className="rounded-[24px] p-5 ring-1 ring-inset ring-[#ff9f0a]/30 bg-gradient-to-br from-[#ff9f0a]/[0.14] to-[#ff9f0a]/[0.03] backdrop-blur-2xl">
          <div className="flex items-start gap-3">
            <span className="w-10 h-10 rounded-xl grid place-items-center bg-[#ff9f0a] text-white shrink-0"><Alert size={19} /></span>
            <div className="min-w-0">
              <div className={`text-[15px] font-semibold ${T1}`}>{t('dbt')}</div>
              <p className={`text-[13.5px] mt-1 leading-relaxed ${T2}`}>{tx(DBT_TEXT, lang)}</p>
              <button onClick={() => go('grievance')} className="inline-flex items-center gap-1 mt-2 text-[12.5px] font-semibold text-[#c27400] dark:text-[#ffb340]">{t('payIssue')} {t('openDiag')} <ChevronRight size={13} /></button>
            </div>
          </div>
        </div>
        )}
      </div>
    </div>
  );
}

            <div className="flex flex-wrap gap-2 mt-4">
              <a href="https://pgportal.gov.in" target="_blank" rel="noopener noreferrer" className={BTN_BLUE}><Send size={14} /> CPGRAMS</a>

/* ------------------------------------------------------------------ *
 * Spotlight (⌘K)
 * ------------------------------------------------------------------ */
function Spotlight({ docs, lang, t, onClose, onSelect, onDiscover }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  const listRef = useRef(null);
  useEffect(() => { setTimeout(() => inputRef.current && inputRef.current.focus(), 20); }, []);
  const query = q.trim().toLowerCase();
  const results = useMemo(() => {
    if (!query) return docs.slice(0, 8).map(d => ({ d, snip: tx(d.summary, lang) }));
    const toks = query.split(/\s+/);
    return docs.map(d => {
      const names = Object.values(d.name || {}).filter(Boolean).join(' ').toLowerCase();
      const clauses = ['benefits', 'eligibility', 'steps'].flatMap(k => [...txl(d[k], 'en'), ...txl(d[k], lang)]);
      const hay = `${names} ${d.ministry} ${tx(d.summary, 'en')} ${tx(d.summary, lang)} ${d.amounts.join(' ')} ${clauses.join(' ')} ${Object.values((CATS[d.category] || CATS.legal).label).join(' ')} ${d.docType}`.toLowerCase();
      if (!toks.every(w => hay.includes(w))) return null;
      const score = toks.reduce((s, w) => s + (names.includes(w) ? 3 : 0) + (d.ministry.toLowerCase().includes(w) ? 1 : 0), 0);
      const snip = clauses.find(c => toks.some(w => c.toLowerCase().includes(w))) || tx(d.summary, lang);
      return { d, score, snip };
    }).filter(Boolean).sort((a, b) => b.score - a.score);
  }, [query, docs, lang]);
  const exactTitle = docs.some(d => Object.values(d.name || {}).filter(Boolean).some(n => n.toLowerCase().includes(query)));
  const showAI = query.length >= 2;
  const total = results.length + (showAI ? 1 : 0);
  useEffect(() => { setSel(0); }, [query]);
  useEffect(() => {
    const el = listRef.current && listRef.current.querySelector(`[data-idx="${sel}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }, [sel]);
  const choose = i => {
    if (showAI && i === 0) return onDiscover(q.trim());
    const r = results[i - (showAI ? 1 : 0)];
    if (r) onSelect(r.d.id);
  };
  const onKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => (total ? (s + 1) % total : 0)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => (total ? (s - 1 + total) % total : 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(sel); }
    else if (e.key === 'Escape') { e.preventDefault(); onClose(); }
  };
  return (
    <div className="fixed inset-0 z-[60] backdrop-blur-xl bg-black/60 flex items-start justify-center pt-[12vh] px-4 fadein" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="max-w-2xl w-full rounded-2xl backdrop-blur-3xl bg-white/95 dark:bg-[#16171b]/95 border border-black/10 dark:border-white/[0.16] shadow-[0_30px_90px_rgba(0,0,0,0.9)] overflow-hidden rise" role="dialog" aria-label="Search">
        <div className="flex items-center gap-3 px-5 py-4 border-b border-black/[0.06] dark:border-white/[0.08]">
          <Search size={20} className={T3} />
          <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey}
            placeholder={t('searchPh')}
            className={`flex-1 bg-transparent outline-none text-[18px] ${T1} placeholder:text-zinc-400 dark:placeholder:text-white/30`} />
          <kbd className="px-1.5 py-0.5 text-[11px] font-semibold bg-black/5 dark:bg-white/10 rounded-md text-zinc-500 dark:text-white/70">esc</kbd>
        </div>
        <div ref={listRef} className="max-h-[52vh] overflow-y-auto thin-scroll p-2">
          {showAI && (
            <button data-idx={0} onMouseEnter={() => setSel(0)} onClick={() => choose(0)}
              className={`shimmer-border w-full text-left rounded-xl px-4 py-3.5 mb-1 flex items-center gap-3 transition ${sel === 0 ? 'bg-[#5e5ce6]/15' : 'bg-[#5e5ce6]/[0.06]'}`}>
              <span className="w-9 h-9 rounded-xl grid place-items-center bg-gradient-to-br from-[#30d158] to-[#0a84ff] text-white shrink-0"><Globe size={18} /></span>
              <div className="min-w-0 flex-1">
                <div className={`text-[14px] font-semibold ${T1} truncate`}>{t('msAction').replace('{q}', q.trim())}</div>
                <div className={`text-[12px] ${T3}`}>{t('msHint')}</div>
              </div>
              <CornerDownLeft size={15} className={T3} />
            </button>
          )}
          {results.map((r, i) => {
            const idx = i + (showAI ? 1 : 0);
            const C = CATS[r.d.category] || CATS.legal;
            return (
              <button key={r.d.id} data-idx={idx} onMouseEnter={() => setSel(idx)} onClick={() => choose(idx)}
                className={`w-full text-left rounded-xl px-3 py-2.5 flex items-center gap-3 transition ${sel === idx ? 'bg-[#0a84ff] text-white' : ''}`}>
                <span className="w-9 h-9 rounded-xl grid place-items-center shrink-0" style={{ background: sel === idx ? 'rgba(255,255,255,.2)' : C.color + '22', color: sel === idx ? '#fff' : C.color }}><C.Icon size={17} /></span>
                <div className="min-w-0 flex-1">
                  <div className={`text-[14px] font-medium truncate ${sel === idx ? '' : T1}`}>{tx(r.d.name, lang)}</div>
                  <div className={`text-[12px] truncate ${sel === idx ? 'text-white/80' : T3}`}>{r.d.ministry} · {r.snip}</div>
                </div>
                <span className={`text-[10px] font-semibold uppercase tracking-wider shrink-0 ${sel === idx ? 'text-white/80' : T3}`}>{tx(DOC_TYPES[r.d.docType].label, lang)}</span>
              </button>
            );
          })}
          {!results.length && !showAI && <div className={`text-center py-10 text-[14px] ${T3}`}>{t('typeMore')}</div>}
        </div>
        <div className={`flex items-center gap-4 px-5 py-2.5 border-t border-black/[0.06] dark:border-white/[0.08] text-[11px] ${T3}`}>
          <span><kbd className="px-1 rounded bg-black/5 dark:bg-white/10">↑</kbd> <kbd className="px-1 rounded bg-black/5 dark:bg-white/10">↓</kbd> navigate</span>
          <span><kbd className="px-1 rounded bg-black/5 dark:bg-white/10">↵</kbd> open</span>
          <span><kbd className="px-1 rounded bg-black/5 dark:bg-white/10">esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

              ? 'bg-[#0a84ff] text-white shadow-[0_0_20px_rgba(10,132,255,0.65),inset_0_1px_1px_rgba(255,255,255,0.35)]'
              : parent ? 'bg-[#0a84ff]/15 text-[#0a84ff] ring-1 ring-inset ring-[#0a84ff]/45'
              : `${T2} hover:bg-black/[0.05] dark:hover:bg-white/[0.08] hover:text-zinc-900 dark:hover:text-white`}`}>
            <n.Icon size={16} /><span className="hidden md:inline">{t(n.label)}</span>
          </button>
        );
      })}
      {sep}
      <div onClick={() => { setFly(!fly); setLangOpen(false); }} role="button" tabIndex={0} aria-label="Audio controls" onKeyDown={e => { if (e.key === 'Enter') setFly(!fly); }}
        className={`flex items-center gap-2 h-9 pl-1 pr-2 sm:pr-2.5 rounded-full cursor-pointer transition shrink-0 ${fly ? 'bg-[#0a84ff]/15 ring-1 ring-inset ring-[#0a84ff]/50' : CHIP}`}>
        <button onClick={e => { e.stopPropagation(); audio.toggle(); }} aria-label={audio.isPlaying ? 'Pause' : 'Play'} className="w-7 h-7 rounded-full bg-zinc-900 text-white dark:bg-white dark:text-black grid place-items-center">
          <PlayGlyph audio={audio} size={13} playClass="ml-[1px]" />
        </button>
        <Equalizer on={audio.isPlaying} color="#30d158" h={14} />
        <span className={`hidden lg:inline text-[11px] font-semibold ${T2}`}>{audio.track === 'english' ? 'EN' : (LANGS.find(l => l.k === audio.regional) || LANGS[1]).short} {audio.gender === 'male' ? '♂' : '♀'}</span>
        <ChevronUp size={14} className={`hidden sm:block ${T3} transition-transform ${fly ? 'rotate-180' : ''}`} />
      </div>
      {sep}
      <button onClick={() => { setLangOpen(!langOpen); setFly(false); }} aria-label={t('language')} aria-expanded={langOpen}
        className={`h-9 px-2.5 sm:px-3 rounded-full flex items-center gap-1.5 text-[12.5px] font-semibold shrink-0 transition ${T1} ${langOpen ? 'bg-[#0a84ff]/15 ring-1 ring-inset ring-[#0a84ff]/50' : CHIP}`}>
        <Globe size={15} className="hidden sm:block" /><span className="sm:hidden">{L.short}</span><span className="hidden sm:inline">{L.label}</span>
      </button>
      <button onClick={onEngineClick} aria-label="AI engine settings" className={`hidden lg:flex items-center gap-1.5 h-9 px-3 rounded-full text-[12px] font-semibold ${CHIP} ${T2} hover:text-zinc-900 dark:hover:text-white shrink-0 shadow-[0_0_16px_-4px_rgba(94,92,230,0.55)]`}>
        <span className={`w-1.5 h-1.5 rounded-full ${engineDot}`} />⚡ {ENGINE_LABEL}
      </button>
      <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} aria-label="Toggle theme" className={`w-9 h-9 rounded-full grid place-items-center ${CHIP} ${T2} hover:text-zinc-900 dark:hover:text-white shrink-0`}>
        {theme === 'dark' ? <Sun size={16} /> : <Moon size={16} />}
      </button>
    </nav>
  );
}

function LangMenu({ lang, setLang, t, onClose }) {
  return (
    <div className="fixed bottom-[92px] left-1/2 -translate-x-1/2 z-50 w-[min(340px,calc(100vw-24px))] rounded-[28px] backdrop-blur-3xl bg-white/90 dark:bg-[#16171b]/90 border border-black/10 dark:border-white/[0.15] shadow-[0_30px_80px_-10px_rgba(0,0,0,0.75)] p-3 rise" role="dialog" aria-label={t('language')}>
      <div className={`px-2 pt-1 pb-2 text-[11px] font-semibold uppercase tracking-[0.1em] ${T3}`}>{t('language')}</div>
      <div className="space-y-1">
        {LANGS.map(l => (
          <button key={l.k} onClick={() => { setLang(l.k); onClose(); }}
            className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-left transition ${lang === l.k ? 'bg-[#0a84ff]/12 ring-2 ring-inset ring-[#0a84ff]/70' : 'hover:bg-black/[0.04] dark:hover:bg-white/[0.06]'}`}>
            <span><span className={`text-[15px] font-semibold ${T1}`}>{l.label}</span><span className={`text-[12px] ml-2 ${T3}`}>{l.name}</span></span>
            {lang === l.k && <Check size={16} className="text-[#0a84ff]" />}
          </button>
        ))}
      </div>
    </div>
  );
}

function KeyModal({ apiKey, setApiKey, onClose, toast, t }) {
  // the Gemini box always opens empty; a saved key is never shown back
  const [val, setVal] = useState('');
  const [ogd, setOgd] = useState(() => ogdKey());
  const [status, setStatus] = useState('');
  const [ogdStatus, setOgdStatus] = useState('');
  const test = async () => {
    setStatus('testing');
    try { await callGemini(val.trim() || apiKey, [{ text: 'Return strict JSON: {"ok": true}' }]); setStatus('ok'); }
    catch (e) { setStatus('fail:' + e.message); }
  };
  const testOgd = async () => {
    setOgdStatus('testing');
    const prev = lsGet('jsOGDKey');
    lsSet('jsOGDKey', ogd.trim());
    const r = await searchOGDCatalog('scheme', 1);
    if (prev) lsSet('jsOGDKey', prev); else { try { localStorage.removeItem('jsOGDKey'); } catch (e) {} }
    setOgdStatus(r === null ? 'fail' : 'ok');
  };
  const save = () => {
    if (val.trim()) { setApiKey(val.trim()); lsSet('jsGeminiKey', val.trim()); }
    if (ogd.trim() && ogd.trim() !== OGD_PUBLIC_KEY) lsSet('jsOGDKey', ogd.trim());
    else { try { localStorage.removeItem('jsOGDKey'); } catch (e) {} }
    toast('API keys saved');
    onClose();
  };
  const removeKey = () => {
    setApiKey('');
    setVal('');
    setStatus('');
    try { localStorage.removeItem('jsGeminiKey'); } catch (e) {}
    toast('Gemini key removed');
  };
  const field = (value, onChange, Icon, placeholder) => (
    <div className={`mt-1.5 flex items-center gap-2 rounded-xl px-3 py-2.5 ${CHIP}`}>
      <Icon size={15} className={T3} />
      <input value={value} onChange={e => onChange(e.target.value)} type="password" autoComplete="new-password" spellCheck={false} placeholder={placeholder} aria-label={placeholder} className={`flex-1 min-w-0 bg-transparent outline-none text-[13px] font-mono ${T1} placeholder:font-sans placeholder:text-zinc-400 dark:placeholder:text-white/35`} />
    </div>
  );
  const msg = (st, ok) => st && (
    <div className={`mt-2 text-[12.5px] ${st === 'ok' ? 'text-emerald-600 dark:text-[#30d158]' : st === 'testing' ? T2 : 'text-[#c27400] dark:text-[#ffb340]'}`}>
      {st === 'testing' ? 'Testing connection…' : st === 'ok' ? ok : st.startsWith('fail:') ? `Unreachable (${st.slice(5)}) — the rule-engine tool will run every stage.` : t('ogdFail')}
    </div>
  );
  return (
    <div className="fixed inset-0 z-[60] backdrop-blur-xl bg-black/60 grid place-items-center px-4 fadein" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="w-full max-w-md max-h-[90vh] overflow-y-auto thin-scroll rounded-[24px] backdrop-blur-3xl bg-white/95 dark:bg-[#16171b]/95 border border-black/10 dark:border-white/[0.16] shadow-[0_30px_90px_rgba(0,0,0,0.9)] p-6 rise" role="dialog" aria-label="API keys">
        <div className="flex items-center gap-3 mb-4">
          <span className="w-10 h-10 rounded-xl grid place-items-center bg-gradient-to-br from-[#5e5ce6] to-[#0a84ff] text-white"><Zap size={18} fill="currentColor" /></span>
          <div>
            <div className={`text-[16px] font-semibold ${T1}`}>{t('viaEngine')}</div>
            <div className={`text-[12px] ${T3} font-mono`}>{MODEL}</div>
          </div>
        </div>
        <label className={`text-[12px] font-medium ${T2}`}>Gemini API key (sent as x-goog-api-key header)</label>
        {field(val, setVal, KeyIc, apiKey ? 'A key is saved. Paste a new one to replace it' : 'Paste your Gemini API key')}
        {msg(status, `✓ Gemini connected · ${geminiRoute.lastModel || MODEL}`)}
        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={test} className={BTN_SOFT}>Test Gemini</button>
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" className={`${BTN} px-3 py-2 text-[#0a84ff]`}>Get a key <External size={13} /></a>
          {apiKey && <button onClick={removeKey} className={`${BTN} px-3 py-2 text-[#d63a30] dark:text-[#ff6961]`}>Remove saved key</button>}
        </div>
        <div className="h-px my-5 bg-black/[0.07] dark:bg-white/[0.1]" />
        <label className={`text-[12px] font-medium ${T2}`}>Data.gov.in OGD API key (sent as the api-key parameter OGD requires)</label>
        {field(ogd, setOgd, Database, 'Data.gov.in API key')}
        {msg(ogdStatus, '✓ Data.gov.in connected')}
        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={testOgd} className={BTN_SOFT}>Test Data.gov.in</button>
          <button onClick={() => setOgd(OGD_PUBLIC_KEY)} className={`${BTN} px-3 py-2 ${T3}`}>Use public key</button>
        </div>
        <p className={`text-[11.5px] mt-4 ${T3}`}>Keys are stored only in this browser (localStorage).</p>
        <div className="flex gap-2 mt-4">
          <button onClick={save} className={BTN_BLUE}>Save</button>
          <button onClick={onClose} className={`${BTN} px-3 py-2 ${T3}`}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ *
 * App — state-based view router (mirrored to the URL hash for Back/Forward)
 * ------------------------------------------------------------------ */
const PAGES = ['catalog', 'detail', 'studio', 'grievance'];
const parseHash = () => {
  const [p, id] = String(window.location.hash || '').replace(/^#\/?/, '').split('/');
  return { page: PAGES.includes(p) ? p : 'catalog', id: id ? decodeURIComponent(id) : '' };
};

function App() {
  const [theme, setTheme] = useState(() => lsGet('jsTheme') || 'dark');
  const [lang, setLang] = useState(() => (UI[lsGet('jsLang')] ? lsGet('jsLang') : 'en'));
  const [apiKey, setApiKey] = useState(() => lsGet('jsGeminiKey') || '');
  const [userDocs, setUserDocs] = usePersist('jsUserDocs', []);
  const [ogdDocs, setOgdDocs] = usePersist('jsOGDDocs', []);
  const [ogdBusy, setOgdBusy] = useState(false);
  const docs = useMemo(() => [...userDocs, ...ogdDocs, ...CATALOG], [userDocs, ogdDocs]);
  const [page, setPage] = useState(() => parseHash().page);
  const [selectedScheme, setSelectedScheme] = useState(() => parseHash().id || lsGet('jsActive') || CATALOG[0].id);
  const doc = docs.find(d => d.id === selectedScheme) || docs[0];
  const [filter, setFilter] = useState('all');
  const [stream, setStream] = useState('all');
  const [letterDoc, setLetterDoc] = useState(null);
  const [query, setQuery] = useState('');
  const [spot, setSpot] = useState(false);
  const [fly, setFly] = useState(false);
  const [langOpen, setLangOpen] = useState(false);
  const [keyOpen, setKeyOpen] = useState(false);
  const [engine, setEngine] = useState('idle');
  const [job, setJob] = useState(null);
  const jobRef = useRef(false);
  const [toasts, setToasts] = useState([]);
  const [checks, setChecks] = usePersist('jsChecks', {});
  const [rules, setRules] = usePersist('jsRules', {});
  const [dbt, setDbt] = usePersist('jsDbtDiag', {});
  const [receipts, setReceipts] = useState({});
  const toastSeq = useRef(0);
  const audio = useVoiceEngine(apiKey);
  const t = useT(lang);
  const selRef = useRef(doc.id);
  selRef.current = doc.id;

  // narrate on the chosen track when a script exists in that language
  const wantLang = audio.track === 'english' ? 'en' : audio.regional;
  const narrLang = hasLang(doc.voiceScript, wantLang) ? wantLang : 'en';
  const docSrc = { key: 'doc:' + doc.id + ':' + narrLang, title: tx(doc.name, lang), text: tx(doc.voiceScript, narrLang), lang: narrLang };

  const toast = useCallback((msg, tone = 'info') => {
    const id = ++toastSeq.current;
    setToasts(ts => [...ts, { id, msg, tone }]);
    setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), 3600);
  }, []);

  const go = useCallback((p, id) => {
    const target = p === 'detail' ? (id || selRef.current) : '';
    setPage(p);
    if (id) setSelectedScheme(id);
    setSpot(false); setFly(false); setLangOpen(false);
    const h = '#/' + p + (target ? '/' + encodeURIComponent(target) : '');
    if (window.location.hash !== h) { try { window.history.pushState(null, '', h); } catch (e) { window.location.hash = h; } }
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  useEffect(() => {
    const onNav = () => { const r = parseHash(); setPage(r.page); if (r.id) setSelectedScheme(r.id); window.scrollTo({ top: 0, behavior: 'auto' }); };
    window.addEventListener('popstate', onNav);
    window.addEventListener('hashchange', onNav);
    return () => { window.removeEventListener('popstate', onNav); window.removeEventListener('hashchange', onNav); };
  }, []);

  useEffect(() => { document.documentElement.classList.toggle('dark', theme === 'dark'); lsSet('jsTheme', theme); }, [theme]);
  useEffect(() => { document.documentElement.lang = lang; lsSet('jsLang', lang); }, [lang]);
  useEffect(() => { lsSet('jsActive', doc.id); }, [doc.id]);
  // SHA-256 audit receipt bound to the document and its current readiness score
  const score = ruleScore(rulesFor(doc), rules[doc.id] || {});
  useEffect(() => {
    let alive = true;
    if (window.crypto && crypto.subtle) generateReceiptHash(doc.id, score).then(h => { if (alive) setReceipts(r => ({ ...r, [doc.id]: h })); }).catch(() => {});
    return () => { alive = false; };
  }, [doc.id, score]);

  // the explainer follows the selected document and language
  // and keeps playing when only the narration language changes
  const narratedDoc = useRef('');
  useEffect(() => {
    const keepPlaying = audio.isPlaying && narratedDoc.current === doc.id && audio.source.key.startsWith('doc:');
    narratedDoc.current = doc.id;
    audio.loadSource(docSrc, keepPlaying);
  }, [doc.id, lang, narrLang]);
  // choosing a site language also chooses the narration; the player can override it afterwards
  const langMounted = useRef(false);
  useEffect(() => {
    if (!langMounted.current) { langMounted.current = true; return; }
    if (lang === 'en') audio.setTrack('english');
    else { audio.setRegional(lang); audio.setTrack('regional'); }
  }, [lang]);

  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setSpot(s => !s); setFly(false); setLangOpen(false); }
      else if (e.key === 'Escape') { setFly(false); setLangOpen(false); setKeyOpen(false); setLetterDoc(null); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const openDoc = id => go('detail', id);
  const openCategory = k => { setFilter(k); setStream('all'); setQuery(''); go('catalog'); };

  const srcKeyOf = (text, q) => `${(q || '').trim().toLowerCase()}|${sanitize(text).length}|${sanitize(text).slice(0, 400)}`;
  const openSaved = key => {
    const saved = userDocs.find(x => x.srcKey === key && x.source === 'gemini');
    if (!saved) return false;
    toast(t('cacheHit'));
    go('detail', saved.id);
    return true;
  };
  const ingest = async ({ text = '', query: q = '', label = '', pdfB64 = '', fromStudio = false, registry = null, held = false, forcedType = '' }) => {
    if (jobRef.current && !held) return;
    const srcKey = pdfB64 ? '' : srcKeyOf(text, q) + forcedType;
    if (srcKey && !held && openSaved(srcKey)) { setSpot(false); return; }
    jobRef.current = true;
    setSpot(false);
    setJob({ stage: 0, query: q || label, studio: fromStudio, engines: [], myscheme: !!registry });
    setEngine('busy');
    const d = await runAgentPipeline({
      apiKey, text, query: q, label, pdfB64, forcedType,
      onStage: (i, eng) => setJob(j => (j ? { ...j, stage: i, engines: i < 3 ? Object.assign([...j.engines], { [i]: eng }) : j.engines } : j)),
    });
    setEngine(d.source === 'gemini' ? 'ok' : 'fallback');
    d.id = 'u-' + Date.now().toString(36);
    d.srcKey = srcKey;
    if (registry) {
      const { msStatus, ...prov } = registry;
      Object.assign(d, prov);
      d.trace[0].note = `myScheme.gov.in: ${msStatus} · ${d.trace[0].note}`;
    }
    setUserDocs(list => [d, ...list].slice(0, 24));
    toast(d.source === 'gemini' ? t('viaEngine') : t('localEngine'));
    setJob(null);
    jobRef.current = false;
    go('detail', d.id);
  };

  // myScheme.gov.in → Gemini agent pipeline → mounted at the top of the catalog and opened
  const searchAndIngestMyScheme = async query => {
    const q = String(query || '').trim();
    if (q.length < 2 || jobRef.current) return;
    setSpot(false);
    if (openSaved(srcKeyOf('', q))) return;
    jobRef.current = true;
    setJob({ stage: 0, query: q, engines: [], myscheme: true });
    const page = await fetchMySchemeText(q);
    await ingest({
      text: page.ok ? page.text : '', query: page.ok ? '' : q, label: q, held: true,
      registry: { src: 'myscheme', url: mySchemeUrl(q), aiProvider: 'myScheme.gov.in Ingestion Agent', msFetched: page.ok, msStatus: page.status },
    });
  };

  // live OGD catalogue → prepended to the catalog with provenance
  const fetchLive = async () => {
    if (ogdBusy) return;
    setOgdBusy(true);
    const recs = await searchOGDCatalog(query.trim() || 'scheme', 6);
    setOgdBusy(false);
    if (recs === null) return toast(t('ogdFail'));
    if (!recs.length) return toast(t('ogdNone'));
    const fresh = recs.map(ogdToDoc).sort((a, b) => b.updated - a.updated);
    setOgdDocs(list => [...fresh, ...list.filter(x => !fresh.some(f => f.id === x.id))].slice(0, 30));
    setFilter('all');
    toast(t('ogdAdded').replace('{n}', fresh.length));
  };
  const analyzeOgd = async d => {
    const rows = await fetchOGDData(d.resourceId, '', 15);
    ingest({ text: ogdSourceText(d, rows || []), label: tx(d.name, 'en') });
  };

  const pill = job && !(job.studio && page === 'studio')
    ? (job.myscheme ? t('msLoading') : job.query ? `⚡ ${t('discover')} "${job.query}"` : t('stages')[Math.min(job.stage, 2)])
    : '';

  return (
    <div id="top" className={`min-h-screen pb-36 ${T1}`}>
      <header className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-5 flex items-center justify-between gap-4">
        <button onClick={() => go('catalog')} className="flex items-center gap-3 text-left" aria-label="JanSetu AI home">
          <span className="w-11 h-11 rounded-[14px] grid place-items-center bg-gradient-to-br from-[#5e5ce6] via-[#0a84ff] to-[#30d158] text-white shadow-[0_10px_30px_-8px_rgba(10,132,255,0.7)]"><Shield size={22} strokeWidth={2.3} /></span>
          <span>
            <span className="block text-[22px] font-semibold tracking-[-0.02em] leading-none">JanSetu <span className="bg-gradient-to-r from-[#5e5ce6] to-[#0a84ff] bg-clip-text text-transparent">AI</span></span>
            <span className={`block text-[12px] mt-1 ${T3}`}>{t('engineSub')}</span>
          </span>
        </button>
        <button onClick={() => setKeyOpen(true)} aria-label="AI engine settings" className={`${BTN_SOFT} !px-2.5 lg:!px-3.5`}>
          <span className={`w-1.5 h-1.5 rounded-full ${engine === 'busy' ? 'bg-[#0a84ff] pulse-dot' : engine === 'fallback' || !apiKey ? 'bg-[#ff9f0a]' : 'bg-[#30d158]'}`} />
          {apiKey ? <><span className="hidden lg:inline">Engine</span><KeyIc size={14} className="lg:hidden" /></> : <><KeyIc size={14} /><span>{t('addKey')}</span></>}
        </button>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-6">
        <div key={page === 'detail' ? 'detail:' + doc.id : page} className="rise">
          {page === 'catalog' && (
            <CatalogPage docs={docs} lang={lang} t={t} filter={filter} setFilter={setFilter} query={query} setQuery={setQuery}
              lastId={doc.id} onOpen={openDoc} onDiscover={searchAndIngestMyScheme} onSpotlight={() => setSpot(true)} go={go} onFetchLive={fetchLive} ogdBusy={ogdBusy} stream={stream} setStream={setStream} onLetter={setLetterDoc} />
          )}
          {page === 'detail' && doc.source === 'ogd' && (
            <OgdDetail doc={doc} lang={lang} t={t} audio={audio} docSrc={docSrc} go={go} onCategory={openCategory} onAnalyze={analyzeOgd} busy={!!job} />
          )}
          {page === 'detail' && doc.source !== 'ogd' && (
            <DetailPage doc={doc} lang={lang} t={t} audio={audio} docSrc={docSrc} checks={checks} setChecks={setChecks} rules={rules} setRules={setRules}
              trackId={receipts[doc.id] || 'JS-SHA256-…'} apiKey={apiKey} onEngine={setEngine} toast={toast} go={go} onCategory={openCategory} onLetter={setLetterDoc} />
          )}
          {page === 'studio' && <StudioPage t={t} lang={lang} onIngest={ingest} job={job} />}
          {page === 'grievance' && <GrievancePage lang={lang} t={t} dbt={dbt} setDbt={setDbt} onOpen={openDoc} />}
        </div>
        <footer className={`mt-12 text-center text-[12px] leading-relaxed ${T3}`}>
          {t('footer1')}<br />{t('footer2')}
        </footer>
      </main>

      {pill && (
        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[70] shimmer-border rounded-full px-4 py-2.5 backdrop-blur-3xl bg-white/90 dark:bg-[#16171b]/90 shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex items-center gap-2.5 text-[13px] font-medium max-w-[calc(100vw-24px)] rise">
          <Loader size={15} className="animate-spin text-[#0a84ff] shrink-0" /><span className="truncate">{pill}</span>
        </div>
      )}
      <div className="fixed top-5 right-5 z-[70] flex flex-col gap-2 items-end pointer-events-none">
        {toasts.map(x => <div key={x.id} className="rise pointer-events-auto rounded-2xl px-4 py-2.5 text-[13px] font-medium backdrop-blur-3xl bg-white/90 dark:bg-[#1c1d22]/90 border border-black/10 dark:border-white/[0.12] shadow-[0_15px_40px_rgba(0,0,0,0.4)]">{x.msg}</div>)}
      </div>

      {(langOpen || fly) && <div className="fixed inset-0 z-40" onClick={() => { setLangOpen(false); setFly(false); }} />}
      {langOpen && <LangMenu lang={lang} setLang={setLang} t={t} onClose={() => setLangOpen(false)} />}
      {fly && <AudioFlyout audio={audio} t={t} onClose={() => setFly(false)} />}
      <Dock page={page} go={go} t={t} lang={lang} langOpen={langOpen} setLangOpen={setLangOpen} theme={theme} setTheme={setTheme} audio={audio}
        onSearch={() => { setSpot(true); setFly(false); setLangOpen(false); }} fly={fly} setFly={setFly}
        engine={engine} onEngineClick={() => setKeyOpen(true)} />
      {spot && <Spotlight docs={docs} lang={lang} t={t} onClose={() => setSpot(false)} onSelect={openDoc} onDiscover={searchAndIngestMyScheme} />}
      {letterDoc && <LetterModal key={letterDoc.id + lang} doc={letterDoc} lang={lang} t={t} toast={toast} onClose={() => setLetterDoc(null)} />}
      {keyOpen && <KeyModal apiKey={apiKey} setApiKey={setApiKey} onClose={() => setKeyOpen(false)} toast={toast} t={t} />}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('JanSetu AI crashed:', err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24, fontFamily: 'inherit' }}>
        <div style={{ maxWidth: 440, textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 600 }}>JanSetu AI hit a snag</div>
          <p style={{ opacity: 0.7, fontSize: 14, marginTop: 8 }}>{String(this.state.err && this.state.err.message)}</p>
          <button onClick={() => { try { localStorage.removeItem('jsUserDocs'); } catch (e) {} location.reload(); }}
            style={{ marginTop: 16, padding: '10px 18px', borderRadius: 999, border: 0, background: '#0a84ff', color: '#fff', fontWeight: 600, cursor: 'pointer' }}>Reset &amp; reload</button>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
