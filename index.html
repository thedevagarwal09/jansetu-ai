  {"id": "raj-amnesty-2026", "docType": "notification", "category": "biz", "ministry": "Government of Rajasthan · Commercial Taxes Department", "portal": "https://www.rajtax.gov.in", "helpline": "", "deadline": "2026-09-30", "authority": "Commercial Taxes Department, Rajasthan", "email": "", "sourceUrl": "https://a2ztaxcorp.net/rajasthan-govt-notifies-amnesty-scheme-2026-for-settlement-of-outstanding-tax-demands/", "amounts": ["Pay 50% of principal tax", "100% interest and penalty waiver", "Cases up to ₹1 crore"], "documents": ["Details of the pending demand", "Undertaking to withdraw pending cases", "Record of deposits under Amnesty Scheme 2025, if any"], "source": "catalog", "name": {"en": "Rajasthan Amnesty Scheme 2026", "hi": "राजस्थान माफी योजना 2026", "bn": "রাজস্থান অ্যামনেস্টি স্কিম 2026", "te": "రాజస్థాన్ అమ్నెస్టీ పథకం 2026", "ta": "ராஜஸ்தான் பொது மன்னிப்பு திட்டம் 2026"}, "summary": {"en": "A Rajasthan scheme notified on 11 February 2026 to settle old demands under repealed State tax laws for periods up to 30 June 2017. In cases up to ₹1 crore, paying half the principal tax clears the rest, with interest, penalty and late fee waived.", "hi": "11 फरवरी 2026 को अधिसूचित एक राजस्थान योजना, जिसके तहत 30 जून 2017 तक की अवधि के लिए निरस्त राज्य कर कानूनों के तहत पुरानी मांगों का निपटारा किया जाता है। ₹1 करोड़ तक के मामलों में, मूल कर का आधा भुगतान करने से शेष राशि साफ हो जाती है, तथा ब्याज, जुर्माना और विलंब शुल्क माफ कर दिए जाते हैं।", "bn": "11 ফেব্রুয়ারি 2026 এ বিজ্ঞাপিত একটি রাজস্থান স্কিম, যা 30 জুন 2017 পর্যন্ত সময়ের জন্য বাতিল হওয়া রাজ্য কর আইনের অধীনে পুরানো দাবিগুলি নিষ্পত্তি করে। ₹1 কোটি পর্যন্ত মামলায়, মূল করের অর্ধেক পরিশোধ করলে বাকি অংশ পরিষ্কার হয়ে যায় এবং সুদ, জরিমানা ও দেরির ফি মওকুফ করা হয়।", "te": "11 ఫిబ్రవరి 2026 న నోటిఫై చేయబడిన రాజస్థాన్ పథకం, ఇది 30 జూన్ 2017 వరకు గల కాలానికి రద్దు చేయబడిన రాష్ట్ర పన్ను చట్టాల క్రింద పాత డిమాండ్లను పరిష్కరిస్తుంది. ₹1 కోటి వరకు ఉన్న కేసులలో, అసలు పన్నులో نصف చెల్లించడం ద్వారా మిగిలిన మొత్తం క్లియర్   {"id": "bengaluru-swm-bylaws", "docType": "bylaw", "category": "legal", "ministry": "Bruhat Bengaluru Mahanagara Palike · Bengaluru Solid Waste Management Limited", "portal": "https://site.bbmp.gov.in", "helpline": "", "deadline": "", "authority": "Ward Assistant Engineers and Assistant Executive Engineers can be authorised to impose penalties", "email": "", "sourceUrl": "https://citizenmatters.in/bengaluru-bbmp-solid-waste-management-swm-draft-bye-laws-segregation-penalty/", "amounts": ["Up to ₹25,000 for bulk generators", "₹10,000 for residents", "Bulk means 100 kg+ a day"], "documents": ["Trade licence", "Property tax receipt", "Agreement with an authorised waste vendor", "Annual return, for bulk generators"], "source": "catalog", "name": {"en": "Bengaluru Solid Waste Management Bye-laws, 2020", "hi": "बेंगलुरु ठोस अपशिष्ट प्रबंधन उप-नियम, 2020", "bn": "বেঙ্গালুরু কঠিন বর্জ্য ব্যবস্থাপনা উপ-আইন, ২০২০", "te": "బెంగళూరు ఘన వ్యర్థాల నిర్వహణ ఉప-చట్టాలు, 2020", "ta": "பெங்களூரு திடக் கழிவு மேலாண்மை துணை விதிகள், 2020"}, "summary": {"en": "City rules on sorting and disposing of waste in Bengaluru. Waste must be segregated at source, and bulk generators must process wet waste on site. Fine amounts here come from news reports and the 2019 draft, so confirm current rates with the city.", "hi": "बेंगलुरु में कचरे को छांटने और निपटाने के शहर के नियम। कचरे को उसके स्रोत पर ही अलग-अलग किया जाना चाहिए, और बड़े पैमाने पर कचरा पैदा करने वालों को गीले कचरे को अपनी जगह पर ही संसाधित करना होगा। यहाँ बताई गई जुर्माने की रकम समाचार रिपोर्टों और 2019 के प्रारूप से ली गई है, इसलिए शहर के अधिकारियों से वर्तमान दरों की पुष्टि करें।", "bn": "বেঙ্গালুরুতে বর্জ্য পৃথকীকরণ এবং ফেলার শহরভিত্তিক নিয়মাবলী। বর্জ্য উৎপত্তিস্থলেই আলাদা করতে হবে, এবং বড় পরিমাণের বর্জ্য উৎপাদনকারীদের ভেজা বর্জ্য নিজেদের জায়গায় প্রক্রিয়াজাত করতে হবে। এখানে জরিমানার পরিমাণ সংবাদপত্রের প্রতিবেদন এবং ২০১৯ সালের খসড়া থেকে নেওয়া হয়েছে, তাই শহরের কর্তৃপক্ষের কাছ থেকে বর্তমান হার নিশ্চিত করুন।", "te": "బెంగళూరులో చెత్తను  rules ask everyone to sort waste at source. Wet waste goes in a green bin, dry waste in a blue bin, and sanitary waste in a red bin. Buildings that produce more than one hundred kilograms a day must process wet waste on site. News reports describe fines of up to twenty five thousand rupees for burning or dumping. Rates can change, so confirm them with the city and always ask for a receipt.", "hi": "बेंगलुरु के ठोस अपशिष्ट नियम सभी से स्रोत पर ही कचरा छांटने के लिए कहते हैं। गीला कचरा हरे डिब्बे में, सूखा कचरा नीले डिब्बे में, और स्वच्छता से जुड़ा कचरा लाल डिब्बे में जाता है। एक दिन में एक सौ किलोग्राम से अधिक कचरा पैदा करने वाली इमारतों को गीले कचरे को अपनी जगह पर ही संसाधित करना होगा। समाचार रिपोर्टों में कचरा जलाने या फेंकने पर पच्चीस हजार रुपये तक के जुर्माने की बात कही गई है। दरें बदल सकती हैं, इसलिए शहर के अधिकारियों से उनकी पुष्टि करें और हमेशा रसीद मांगें।", "bn": "বেঙ্গালুরুর কঠিন বর্জ্য নিয়মাবলী সবাইকে উৎসেই বর্জ্য আলাদা করতে বলে। ভেজা বর্জ্য সবুজ বালতিতে, শুকনো বর্জ্য নীল বালতিতে এবং স্যানিটারি বর্জ্য লাল বালতিতে ফেলতে হয়। দিনে একশত কিলোগ্রামের বেশি বর্জ্য তৈরি করে এমন ভবনগুলোকে ভেজা বর্জ্য নিজেদের জায়গাতেই প্রক্রিয়াজাত করতে হবে। সংবাদপত্রের প্রতিবেদনে বর্জ্য পোড়ানো বা ফেলার জন্য পঁচিশ হাজার টাকা পর্যন্ত জরিমানার কথা বলা হয়েছে। হারের পরিবর্তন হতে পারে, তাই শহর কর্তৃপক্ষের কাছ থেকে তা নিশ্চিত করুন এবং সর্বদা রসিদ চেয়ে নিন।", "te": "బెంగళూరు ఘన వ్యర్థాల నిబంధనలు ప్రతి ఒక్కరినీ చెత్తను తయారయ్యే చోటే వేరు చేయమని కోరుతున్నాయి. తడి చెత్త ఆకుపచ్చ డబ్బాలో, పొడి చెత్త నీలిరంగు డబ్బాలో మరియు పారిశుధ్య చెత్త ఎర్రటి డబ్బాలో వేయాలి. రోజుకు ఒక వంద కిలోగ్రాముల కంటే ఎక్కువ చెత్తను ఉత్పత్తి చేసే భవనాలు తడి చెత్తను అక్కడే సంస్కరించాలి. చెత్తను కాల్చడం లేదా పారవేయడం వల్ల ఇరవై ఐదు వేల రూపాయల వరకు జరిమానాలు ఉంటాయని వార్తా నివేదికలు చెబుతున్నాయి. ధరలు మారవచ్చు, కాబట్టి వాటిని నగర అధికారులతో సరిచూసుకోండి మరియు ఎల్లప్పుడూ రసీదును అడగండి.", "ta": "பெங்களூரின் திடக் கழிவு விதிகள் அனைவரையும் கழிவுகளை உருவாகும் இடத்திலேயே வகைப்படுத்துமாறு கேட்டுக்கொள்கின்றன. ஈரக் கழிவு பச்சைத் தொட்டியிலும், உலர் கழிவு நீலத் தொட்டியிலும், சுகாதாரக் கழிவு சிவப்புத் தொட்டியிலும் போடப்பட வேண்டும். ஒரு நாளைக்கு நூறு கிலோகிராமிற்கு மேல் கழிவுகளை உருவாக்கும் கட்டடங்கள் ஈரக் கழிவை அந்த இடத்திலேயே மறுசுழற்சி செய்ய வேண்டும். கழிவுகளை எரிப்பது அல்லது கொட்டுவதற்கு இருபத்தைந்தாயிரம் ரூபாய் வரை அபராதம் விதிக்கப்படுவதாக செய்தி அறிக்கைகள் விவரிக்கின்றன. கட்டணங்கள் மாறக்கூடும், எனவே அவற்றை நகர அதிகாரிகளிடம் உறுதிப்படுத்திக் கொள்ளுங்கள், எப்போதும் ரசீது கேளுங்கள்."}},

ాలేదు, కాబట్టి నీతి ఆయోగ్ ని తనిఖీ చేయండి.", "ta": "எலக்ட்ரிக் ஸ்கூட்டர்கள் மற்றும் மூன்று சக்கர வாகனங்களுக்கான பேட்டரி மாற்றத்திற்காக நீதி ஆயோக் மூலம் 21 ஏப்ரல் 2022 அன்று ஒரு வரைவு வெளியிடப்பட்டது. 5 ஜூன் 2022 வரை கருத்துகள் வரவேற்கப்பட்டன. இதன் பிந்தைய நிலை இங்கே உறுதிப்படுத்தப்படவில்லை, எனவே நீதி ஆயோக்கை சரிபார்க்கவும்."}, "benefits": {"en": ["Lower GST on lithium-ion batteries and EV supply equipment; no new rate is stated", "Incentives for fixed-battery electric vehicles extended to vehicles with swappable batteries"], "hi": ["लिथियम-आयन बैटरी और ईवी आपूर्ति उपकरणों पर कम जीएसटी; कोई नई दर नहीं बताई गई है", "फिक्स-बैटरी वाले इलेक्ट्रिक वाहनों के लिए मिलने वाली छूट अब बदली जा सकने वाली बैटरी वाले वाहनों को भी मिलेगी"], "bn": ["লিথিয়াম-আয়ন ব্যাটারি এবং ইভি সরবরাহ সরঞ্জামের ওপর কম জিএসটি; কোনো নতুন হার জানানো হয়নি", "স্থায়ী-ব্যাটারির ইলেকট্রিক গাড়ির জন্য উৎসাহ ভাতাগুলো বদলযোগ্য ব্যাটারিযুক্ত গাড়ির ক্ষেত্রেও বাড়ানো হয়েছে"], "te": ["లిథియం-అయాన్ బ్యాటరీలు మరియు ఈవీ సప్లై పరికరాలపై తక్కువ జీఎస్‌టీ; కొత్త రేటు ఏదీ చెప్పబడలేదు", "ఫిక్స్డ్-బ్యాటరీ ఎలక్ట్రిక్ వాహనాల కోసం ఇచ్చే ప్రోత్సాహకాలు స్వాప్ చేయదగిన బ్యాటరీలు ఉన్న వాహనాలకు కూడా పొడిగించబడ్డాయి"], "ta": ["லித்தியம்-அயன் பேட்டரிகள் மற்றும் ஈவி விநியோக உபகரணங்கள் மீது குறைந்த ஜிஎஸ்டி; புதிய விகிதம் எதுவும் குறிப்பிடப்படவில்லை", "நிலையான-பேட்டரி கொண்ட எலக்ட்ரிக் வாகனங்களுக்கான சலுகைகள் மாற்றத்தக்க பேட்டரிகள் கொண்ட வாகனங்களுக்கும் நீட்டிக்கப்பட்டுள்ளன"]}, "eligibility": {"en": ["You use an electric scooter or a three-wheeler electric rickshaw", "You provide batteries for electric vehicles", "You run a battery swapping station or a public charging station"], "hi": ["आप एक इलेक्ट्रिक स्कूटर या तिपहिया इलेक्ट्रिक रिक्शा चलाते हैं", "आप इलेक्ट्रिक वाहनों के लिए बैटरी उपलब्ध कराते हैं", "आप बैटरी अदला-बदली केंद्र या सार्वजनिक चार्जिंग स्टेशन चलाते हैं"], "bn": ["আপনি একটি ইলেকট্রিক স্কুটার বা তিন চাকার ইলেকট্রিক রিকশা চালান", "আপনি ইলেকট্রিক গাড়ির জন্য ব্যাটারি সরবরাহ করেন", "আপনি একটি ব্যাটারি বদল কেন্দ্র বা জনবহুল চার্জিং il the fifth of June twenty twenty two, and that window has closed. Check the NITI Aayog website for its current status.", "hi": "यह इलेक्ट्रिक स्कूटरों और तिपहिया वाहनों के लिए अप्रैल दो हज़ार बाईस में नीति आयोग द्वारा जारी की गई बैटरी अदला-बदली नीति का एक प्रारूप है। यह बैटरियों पर कम जीएसटी और बदली जा सकने वाली बैटरी वाले वाहनों के लिए छूट का प्रस्ताव करता है। पाँच जून दो हज़ार बाईस तक सुझाव आमंत्रित किए गए थे, और वह समय-सीमा समाप्त हो चुकी है। इसकी वर्तमान स्थिति के लिए नीति आयोग की वेबसाइट की जाँच करें।", "bn": "এটি ইলেকট্রিক স্কুটার এবং তিন চাকার গাড়ির জন্য এপ্রিল দুই হাজার বাইশ সালে নীতি আয়োগ কর্তৃক প্রকাশিত একটি ব্যাটারি বদল নীতির খসড়া। এটি ব্যাটারির ওপর কম জিএসটি এবং বদলযোগ্য ব্যাটারিযুক্ত গাড়ির জন্য উৎসাহ ভাতার প্রস্তাব করে। পাঁচ জুন দুই হাজার বাইশ পর্যন্ত মতামত চাওয়া হয়েছিল, এবং সেই সময়সীমা শেষ হয়ে গেছে। এর বর্তমান অবস্থার জন্য নীতি আয়োগের ওয়েবসাইট যাচাই করুন।", "te": "ఇది ఎలక్ట్రిక్ స్కూటర్లు మరియు త్రిచక్ర వాహనాల కోసం ఏప్రిల్ రెండు వేల ఇరవై రెండు లో నీతి ఆయోగ్ ద్వారా విడుదల చేయబడిన బ్యాటరీ స్వాపింగ్ విధానం యొక్క డ్రాఫ్ట్. ఇది బ్యాటరీలపై తక్కువ జీఎస్‌టీని మరియు మార్చుకోదగిన బ్యాటరీలు ఉన్న వాహనాల కోసం ప్రోత్సాహకాలను ప్రతిపాదిస్తుంది. ఐదు జూన్ రెండు వేల ఇరవై రెండు వరకు సలహాలు ఆహ్వానించబడ్డాయి, మరియు ఆ గడువు ముగిసింది. దీని ప్రస్తుత స్థితి కోసం నీతి ఆయోగ్ వెబ్‌సైట్‌ను తనిఖీ చేయండి.", "ta": "இது எலக்ட்ரிக் ஸ்கூட்டர்கள் மற்றும் மூன்று சக்கர வாகனங்களுக்காக ஏப்ரல் இரண்டாயிரத்து இருபத்தி இரண்டு இல் நீதி ஆயோக் மூலம் வெளியிடப்பட்ட பேட்டரி மாற்றுக் கொள்கையின் வரைவு ஆகும். இது பேட்டரிகள் மீது குறைந்த ஜிஎஸ்டி மற்றும் மாற்றத்தக்க பேட்டரிகள் கொண்ட வாகனங்களுக்கான சலுகைகளைப் பரிந்துரைக்கிறது. ஐந்தாம் ஜூன் இரண்டாயிரத்து இருபத்தி இரண்டு வரை கருத்துகள் வரவேற்கப்பட்டன, அந்த அவகாசம் முடிந்துவிட்டது. இதன் தற்போதைய நிலைக்கு நீதி ஆயோக் இணையதளத்தைச் சரிபார்க்கவும்."}}

const tx = (v, lang) => {
  if (v == null) return '';
  if (typeof v === 'string' || Array.isArray(v)) return v;
  const x = v[lang];
  if (x && (!Array.isArray(x) || x.length)) return x;
  return v.en != null ? v.en : '';
};
const txl = (v, lang) => { const r = tx(v, lang); return Array.isArray(r) ? r : (r ? [r] : []); };
const hasLang = (v, lang) => !!(v && typeof v === 'object' && v[lang] && String(v[lang]).trim());
const fmt = s => { s = Math.max(0, s || 0); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/* ------------------------------------------------------------------ *
 * Deterministic Statutory Parser (Rule-Engine Tool)

const AMT_RX = /(?:\u20B9|\brs\.?|\binr)\s?\d[\d,]*(?:\.\d+)?(?:\s?(?:lakh|lac|crore|k)\b)?|\b\d[\d,.]*\s?(?:lakh|crore)\b/gi;
const DOC_KEYWORDS = [
  ['aadhaar', 'Aadhaar card'], ['pan', 'PAN card'], ['passbook', 'Bank passbook'], ['bank account', 'Bank account details'],
  ['income certificate', 'Income certificate'], ['caste certificate', 'Caste certificate'], ['land record', 'Land records'],
  ['ration card', 'Ration card'], ['photograph', 'Passport-size photograph'], ['domicile', 'Domicile certificate'],
  ['birth certificate', 'Birth certificate'], ['gst', 'GST registration'], ['udyam', 'Udyam registration certificate'],
  ['trade licence', 'Trade licence'], ['trade license', 'Trade licence'], ['electricity bill', 'Electricity bill'],
  ['quotation', 'Supplier quotation'], ['marksheet', 'Marksheet'], ['lease', 'Lease agreement'],
];
const CAT_KEYWORDS = {
  agri: /farm|kisan|crop|agricultur|irrigation|horticultur|fisher|livestock|dairy/i,
  edu: /scholar|student|school|college|education|tuition|girl child|skill/i,
  health: /health|hospital|medical|treatment|insurance|disease|ayushman|maternity/i,
  biz: /msme|enterprise|udyam|business|artisan|loan|credit|startup|vendor|self-help/i,
  house: /housing|house|awas|rooftop|solar|electricity|shelter|rent/i,
  legal: /bylaw|bye-law|penalt|fine|offence|prosecut|municipal|ward|compliance/i,
};
const normRupees = raw => sanitize(raw).replace(/\b(?:rs|inr)\.?\s?(?=\d)/gi, '₹');
const parseRupee = s => {
  const m = String(s).replace(/,/g, '').match(/(\d+(?:\.\d+)?)\s*(lakh|lac|crore)?/i);
  if (!m) return null;
  const n = parseFloat(m[1]);
  return Math.round(/crore/i.test(m[2] || '') ? n * 1e7 : /lakh|lac/i.test(m[2] || '') ? n * 1e5 : n);
};

// Stage 1 tool: statutory taxonomy from the raw text
function ruleTaxonomy(raw, hint) {
  const text = normRupees(raw);
  const title = sanitize(hint || '');
  if (text.length < 80) {
    const q = title || text || 'Requested policy';
    return { short: true, title: q, docType: 'scheme', category: Object.keys(CAT_KEYWORDS).find(k => CAT_KEYWORDS[k].test(q)) || 'legal', ministry: 'Not yet verified', portal: '', helpline: '' };
  }
  const lower = text.toLowerCase();
  const head = title || (text.match(/^TITLE: (.+)$/m) || [])[1] || text.slice(0, 200);
  const docType = /\bdraft\b[^.\n]{0,60}(policy|rules|bill|regulations)|public comment|comments? (are |is |were )?invited|objections and suggestions|white ?paper/i.test(text) ? 'policy'
    : /gazette|notification|\bs\.o\.\s?\d|g\.s\.r|hereby notif|amnesty/i.test(text) ? 'notification'
    : /scheme|yojana|mission|abhiyan/i.test(head) ? 'scheme'
    : /bylaw|bye-law|municipal|corporation|\bward\b|nagar/i.test(text) ? 'bylaw' : 'scheme';
  let category = 'legal', bestScore = 0;
  Object.entries(CAT_KEYWORDS).forEach(([k, rx]) => { const m = lower.match(new RegExp(rx.source, 'gi')); const sc = m ? m.length : 0; if (sc > bestScore) { bestScore = sc; category = k; } });
  const firstLine = text.split('\n').map(s => s.trim()).find(s => s.length > 6 && s.length < 110);
  const nameMatch = text.match(/notifies the ([A-Z][\w\s&()-]{6,90}?)(?: for |[.,])/) || text.match(/^TITLE: (.+)$/m);
  const urlMatch = text.match(/https?:\/\/[^\s)]+|\b(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:gov|nic)\.in\b[^\s)]*/i);
  const helpMatch = text.match(/(?:helpline|toll[- ]free|call)[^\d]{0,20}(\d[\d -]{3,14}\d)/i);
  return {
    short: false, docType, category,
    title: title || (nameMatch && nameMatch[1].trim()) || firstLine || 'Ingested Document',
    ministry: (text.match(/(MINISTRY OF [A-Z ,&]+|DEPARTMENT OF [A-Z ,&]+|[A-Z][a-z]+ Municipal Corporation)/) || text.match(/^PUBLISHER: (.+)$/m) || [])[1] || 'Parsed from uploaded text',
    portal: urlMatch ? (/^https?:/i.test(urlMatch[0]) ? urlMatch[0] : 'https://' + urlMatch[0]) : '',
    helpline: helpMatch ? helpMatch[1].trim() : '',
  };
}

// Stage 2 tool: dynamic JSON rule objects from eligibility clauses
function extractRules(eligibility, sentences) {
  const rules = eligibility.map(s => {
    const income = /income/i.test(s) && s.match(/(?:up to|upto|not exceed(?:ing)?|below|less than|maximum of|ceiling of|within)\s*(\u20B9\s?[\d,]+(?:\.\d+)?(?:\s?(?:lakh|lac|crore))?)/i);
    if (income) return { label: { en: s }, type: 'max', field: 'income', value: parseRupee(income[1]), unit: '₹', quote: s };
    const isAge = /\bage\b|\baged\b|years old/i.test(s);
    const minAge = isAge && s.match(/(?:at least|minimum(?: age)?(?: of)?|not less than|above)\s*(\d{1,2})\s*years?/i);
    if (minAge) return { label: { en: s }, type: 'min', field: 'age', value: +minAge[1], unit: 'years', quote: s };
    const maxAge = isAge && s.match(/(?:below|under|less than|not more than|up to)\s*(\d{1,2})\s*years?/i);
    if (maxAge) return { label: { en: s }, type: 'max', field: 'age', value: +maxAge[1] - (/below|under|less than/i.test(maxAge[0]) ? 1 : 0), unit: 'years', quote: s };
    return { label: { en: s }, type: 'bool', field: 'other', value: null, unit: '', quote: s };
  });
  if (!rules.some(r => r.field === 'income')) {
    const s = sentences.find(x => /income/i.test(x) && /(?:up to|not exceed|below|less than)\s*\u20B9/i.test(x));
    if (s) { const m = s.match(/(\u20B9\s?[\d,]+(?:\.\d+)?(?:\s?(?:lakh|lac|crore))?)/); rules.push({ label: { en: s }, type: 'max', field: 'income', value: parseRupee(m[1]), unit: '₹', quote: s }); }
  }
  return rules.filter(r => r.type === 'bool' || (r.value != null && !isNaN(r.value)));
}

// Stage 2 tool: clause extraction into the citizen-card shape (English)
function ruleExtract(raw, tax) {
  if (tax.short) {
    const q = tax.title;
    return {
      docType: tax.docType, category: tax.category, source: 'heuristic', ministry: tax.ministry, name: { en: q },
      summary: { en: `The live Gemini agent pipeline could not be reached and no source document was supplied for "${q}", so the rule engine cannot state its benefits. Search the exact name on myscheme.gov.in to confirm the official benefits, eligibility and deadlines before you apply.` },
      amounts: [], benefits: { en: ['Official benefit details must be read from the notified guidelines on myscheme.gov.in or the ministry portal'] },
      eligibility: { en: [] }, exclusions: { en: [] }, documents: [], rules: [],
      steps: { en: [`Search "${q}" on myscheme.gov.in`, 'Open the official guidelines and confirm eligibility', 'Apply only on the official portal or at a Common Service Centre', 'Never pay a middleman — applications are free'] },
      voiceScript: { en: `${q}. JanSetu could not reach the live AI pipeline and has no official document for this item. Please search the exact scheme name on my scheme dot gov dot in to confirm the official benefits and eligibility. Apply only on official portals or at a Common Service Centre. Applying is free, so never pay a middleman.` },
      portal: 'https://www.myscheme.gov.in', helpline: '',
    };
  }
  const text = normRupees(raw);
  const sentences = text.replace(/([.!?\u0964;])\s+/g, '$1\n').split(/\n+/).map(s => s.replace(/^\s*(?:\d+[.)]|[-*])\s*/, '').trim()).filter(s => s.length > 14 && s.length < 360);
  const pick = (rx, n) => [...new Set(sentences.filter(s => rx.test(s)))].slice(0, n);
  const lower = text.toLowerCase();
  const amounts = [...new Set((text.match(AMT_RX) || []).map(a => a.trim().replace(/^rs\.?\s?/i, '₹').replace(/^inr\s?/i, '₹')))].slice(0, 6);
  const benefits = pick(/benefit|assistance|subsid|grant|relief|waiv|free of|incentive|loan|scholarship|cover|entitled|allowance|\u20B9|\brs\.?\s?\d|\d+\s?%/i, 5);
  const eligibility = pick(/eligib|must be|must hold|should be|\bage\b|years|income|resident|citizen|applicant|beneficiar|applies to|applicable to|shall comply|owner|holder|registered/i, 5)
    .filter(s => !benefits.includes(s)).slice(0, 5);
  const exclusions = pick(/not eligible|excluded|shall not|ineligible|exclusion|except|disqualif/i, 4);
  const steps = pick(/apply|submit|register|visit|upload|portal|online|verify|file the|fill|credited/i, 6).filter(s => !eligibility.includes(s));
  const documents = [...new Set(DOC_KEYWORDS.filter(([k]) => lower.includes(k)).map(([, v]) => v))];

  const summary = [lead, ...prose.filter(s => s !== lead)].filter(Boolean).slice(0, 2).join(' ').replace(/^DESCRIPTION:\s*/i, '').slice(0, 320);
  const fallbackSteps = tax.docType === 'scheme'
    ? ['Read the official guidelines on the portal', 'Keep the listed documents ready', 'Apply online or at a Common Service Centre', 'Track your application status']
    : ['Read the full notified text', 'Check whether the thresholds apply to you', 'Complete the required compliance action before the deadline', 'Keep the acknowledgement for your records'];
  const b = benefits.length ? benefits : ['See the official document for the exact benefit or relief'];
  const st = steps.length ? steps : fallbackSteps;
  const name = tax.title;
  return {
    docType: tax.docType, category: tax.category, source: 'heuristic', ministry: tax.ministry,
    name: { en: name }, summary: { en: summary || name }, amounts,
    benefits: { en: b }, eligibility: { en: eligibility }, exclusions: { en: exclusions },
    documents, steps: { en: st }, rules: extractRules(eligibility, sentences),
    ...ruleDeadline(text), authority: '', email: (text.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/) || [''])[0],
    voiceScript: { en: `${name}. ${summary} ${b[0] ? 'Key benefit: ' + b[0] + '.' : ''} ${st[0] ? 'First step: ' + st[0] + '.' : ''} Applying through official channels is free.`.replace(/\s+/g, ' ').replace(/\.\./g, '.') },
    portal: tax.portal || (tax.docType === 'notification' ? 'https://egazette.gov.in' : tax.docType === 'bylaw' ? 'https://data.gov.in' : 'https://www.myscheme.gov.in'),
    helpline: tax.helpline || '',
  };
}
// finds a closing date only when the sentence says it is one
const MONTHS = 'january february march april may june july august september october november december'.split(' ');
function ruleDeadline(text) {
  const rx = /[^.\n]*(?:last date|deadline|closes?|closing|on or before|until|up to|upto|valid till)[^.\n]*?(\d{1,2})(?:st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december),?\s+(\d{4})/i;
  const m = text.match(rx);
  if (!m) return { deadline: '', deadlineQuote: '' };
  const month = String(MONTHS.indexOf(m[2].toLowerCase()) + 1).padStart(2, '0');
  return { deadline: `${m[3]}-${month}-${m[1].padStart(2, '0')}`, deadlineQuote: m[0].trim() };
}
const analyze = (raw, hint) => ruleExtract(raw, ruleTaxonomy(raw, hint));

/* Stage 3 tool: deterministic guardrail — every claim that can be checked against the source is checked */
const portalFallback = type => ({ notification: 'https://egazette.gov.in', bylaw: 'https://data.gov.in', policy: 'https://www.mygov.in' }[type] || 'https://www.myscheme.gov.in');
const OFFICIAL_RX = /^https?:\/\/([a-z0-9-]+\.)*(gov\.in|nic\.in)(\/|$)/i;
const normTxt = s => String(s || '').toLowerCase().replace(/[^a-z0-9\u0900-\u097F\u0980-\u09FF\u0B80-\u0BFF\u0C00-\u0C7F]+/g, ' ').trim();
function verifyDoc(doc, source) {
  const checks = [];
  const hasSrc = String(source || '').trim().length >= 80;
  const srcNorm = normTxt(normRupees(source));
  const srcFlat = normRupees(source).replace(/,/g, '');
  const srcDigits = String(source || '').replace(/[^\d]/g, '');
  if (!OFFICIAL_RX.test(doc.portal || '')) {
    checks.push({ ok: false, item: 'Portal domain', detail: `${doc.portal || '(none)'} is not .gov.in / .nic.in — replaced with ${hostOf(portalFallback(doc.docType))}` });
    doc.portal = portalFallback(doc.docType);
  } else checks.push({ ok: true, item: 'Portal domain', detail: hostOf(doc.portal) });
  if (!hasSrc) {
    // with no document to check against, a date or address could be invented: drop them
    if (doc.deadline || doc.email) checks.push({ ok: false, item: 'Deadline and email', detail: 'No source to check them against — removed' });
    doc.deadline = ''; doc.email = '';
    checks.push({ ok: true, item: 'Source grounding', detail: 'No source document supplied — values could not be checked against a text' });
    return { checks, passed: checks.filter(c => c.ok).length, total: checks.length };
  }
  if (doc.helpline) {
    const d = doc.helpline.replace(/[^\d]/g, '');
    const ok = d.length >= 3 && srcDigits.includes(d);
    checks.push({ ok, item: 'Helpline', detail: ok ? doc.helpline : `${doc.helpline} not found in source — removed` });
    if (!ok) doc.helpline = '';
  }
  if (doc.deadline) {
    const ok = /^\d{4}-\d{2}-\d{2}$/.test(doc.deadline) && !isNaN(new Date(doc.deadline + 'T00:00:00')) && normTxt(doc.deadlineQuote).length >= 6 && srcNorm.includes(normTxt(doc.deadlineQuote));
    checks.push({ ok, item: 'Deadline', detail: ok ? doc.deadline : `${doc.deadline} has no verbatim source quote — removed` });
    if (!ok) doc.deadline = '';
  }
  if (doc.email) {
    const ok = String(source).toLowerCase().includes(doc.email.toLowerCase());
    checks.push({ ok, item: 'Email', detail: ok ? doc.email : `${doc.email} not found in source — removed` });
    if (!ok) doc.email = '';
  }
  const keptAmounts = doc.amounts.filter(a => {
    const nums = String(a).replace(/,/g, '').match(/\d+(?:\.\d+)?/g) || [];
    const ok = nums.length > 0 && nums.every(n => srcFlat.includes(n));
    checks.push({ ok, item: 'Amount', detail: ok ? a : `${a} not found in source — removed` });
    return ok;
  });
  doc.amounts = keptAmounts;
  doc.rules = (doc.rules || []).filter(r => {
    const q = normTxt(normRupees(r.quote));
    const quoteOk = q.length >= 8 && srcNorm.includes(q);
    const valueOk = r.type === 'bool' || r.value == null || (r.unit === '₹' ? true : srcFlat.includes(String(r.value)) || srcFlat.includes(String(r.value + 1)));
    const ok = quoteOk && valueOk;
    checks.push({ ok, item: 'Rule', detail: ok ? `"${tx(r.label, 'en').slice(0, 70)}" grounded in source` : `"${tx(r.label, 'en').slice(0, 70)}" has no verbatim source quote — removed` });
    return ok;
  });
  return { checks, passed: checks.filter(c => c.ok).length, total: checks.length };
}

const L_STR = { type: 'OBJECT', properties: Object.fromEntries(['en', 'hi', 'bn', 'te', 'ta'].map(k => [k, { type: 'STRING' }])), required: ['en', 'hi', 'bn', 'te', 'ta'], propertyOrdering: ['en', 'hi', 'bn', 'te', 'ta'] };

const parseJSON = s => {
  const c = String(s || '').replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
  const i = c.indexOf('{'), j = c.lastIndexOf('}');
  return JSON.parse(i >= 0 ? c.slice(i, j + 1) : c);
};

// Google's capacity shifts per model, so a 503 is retried once and then handed to the next model.
// The model that last answered is tried first on the next call.
const geminiRoute = { idx: 0, lastModel: '', lastTokens: 0 };
const pause = ms => new Promise(r => setTimeout(r, ms));
async function geminiOnce(apiKey, model, parts, ms, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  const stream = !!(opts.onText && window.TextDecoder);
  try {
    const res = await fetch(endpointFor(model, stream), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': String(apiKey || '').trim() },
      body: JSON.stringify({
        contents: [{ role: 'user', parts }],

      }),

    const textOf = d => ((d && d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || []).map(p => p.text || '').join('');
    let out = '';
    let usage = null;
    if (stream && res.body) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        lines.filter(l => l.startsWith('data:')).forEach(l => {
          const d = JSON.parse(l.slice(5));
          out += textOf(d);
          usage = d.usageMetadata || usage;
        });
        opts.onText(out);
      }
    } else {
      const data = await res.json();
      out = textOf(data);
      usage = data.usageMetadata;
    }
    if (!out) throw new Error('Empty response');
    geminiRoute.lastTokens = (usage && usage.totalTokenCount) || 0;
    return parseJSON(out);
  } catch (e) {
    throw e.name === 'AbortError' ? Object.assign(new Error(`timeout ${Math.round(ms / 1000)}s`), { timedOut: true }) : e;
  } finally {
    clearTimeout(timer);
  }
}
async function callGemini(apiKey, parts, timeoutMs = 14000, opts = {}) {
  if (!String(apiKey || '').trim()) throw new Error('API key not added');
  const deadline = Date.now() + timeoutMs * 2;
  const order = MODEL_CHAIN.map((_, i) => MODEL_CHAIN[(geminiRoute.idx + i) % MODEL_CHAIN.length]);
  let lastErr = new Error('No model available');
  for (const model of order) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const left = deadline - Date.now();
      if (left < 1000) throw lastErr;
      try {
        const out = await geminiOnce(apiKey, model, parts, Math.min(timeoutMs, left), opts);
        if (opts.check) opts.check(out);
        geminiRoute.idx = MODEL_CHAIN.indexOf(model);
        geminiRoute.lastModel = model;
        return out;
      } catch (e) {
        lastErr = e;
        if (e.status === 401 || e.status === 403) throw e; // bad key: no other model will help
        if (e.status !== 503 && e.status !== 500 && e.status !== 504) break;   // quota, missing model, rejected settings or timeout: next model
        if (attempt === 0) await pause(800);
      }
    }
  }
  throw lastErr;
}

// One streamed Gemini call does all three stages: the model writes the taxonomy, then the clauses,
// then the five-language text, and each stage is marked as its part of the response arrives.
// If the live call fails, the rule-engine tools do every stage instead.
async function runAgentPipeline({ apiKey, text = '', query = '', label = '', pdfB64 = '', forcedType = '', onStage = () => {} }) {
  const source = sanitize(text);
  const typeHint = forcedType ? `The user says this document is of type "${forcedType}"; use that docType.\n` : '';
  const task = typeHint + (query
    ? `No SOURCE. Scheme, notification or policy named: "${query}".`
    : `${label ? `Title hint: "${label}".\n` : ''}SOURCE:\n${source.slice(0, 12000)}`);
  const pdf = pdfB64 ? [{ inlineData: { mimeType: 'application/pdf', data: pdfB64 } }] : [];
  const t0 = performance.now();
  const at = [t0, 0, 0];
  let stage = 0;
  const reach = s => { if (s > stage) { stage = s; at[s] = performance.now(); onStage(s, 'gemini'); } };
  onStage(0, 'gemini');
  let doc, trace;
  try {
    const g = await callGemini(apiKey, [{ text: `${GPROMPT}\n\n${task}` }, ...pdf], 30000, {
      schema: CARD_SCHEMA,
      check: g => {
        // an incomplete card is treated as a failure, so the next model gets a turn
        if (!(g.name && g.name.en && g.summary && g.summary.en && g.summary.hi && g.summary.ta)) throw new Error('incomplete card');
      },
      onText: out => { if (out.includes('"name"')) reach(2); else if (out.includes('"amounts"')) reach(1); },
    });
    reach(1); reach(2);
    doc = normalizeDoc({ ...g, name: g.name || g.title });
    if (forcedType) doc.docType = forcedType;
    const end = performance.now();
    const model = geminiRoute.lastModel;
    const report = verifyDoc(doc, source);
    trace = [
      { engine: 'gemini', model, ms: Math.round(at[1] - at[0]), note: `${doc.docType} · ${doc.category} · ${doc.ministry}` },
      { engine: 'gemini', model, ms: Math.round(at[2] - at[1]), note: `${doc.rules.length} rules · ${doc.amounts.length} amounts · ${txl(doc.eligibility, 'en').length} eligibility clauses` },
      { engine: 'gemini', model, ms: Math.round(end - at[2]), note: `languages: ${LANGS.filter(l => hasLang(doc.summary, l.k)).map(l => l.k).join(', ')} · guardrail ${report.passed}/${report.total} checks passed · ${geminiRoute.lastTokens.toLocaleString('en-IN')} tokens` },
    ];
    doc.source = 'gemini';
    doc.guard = report;
  } catch (e) {
    onStage(0, 'rule');
    const tax = ruleTaxonomy(source || query, label || query);
    if (forcedType) tax.docType = forcedType;
    onStage(1, 'rule');
    doc = ruleExtract(source || query, tax);
    onStage(2, 'rule');
    const report = verifyDoc(doc, source);
    trace = [
      { engine: 'rule', ms: Math.round(performance.now() - t0), note: `Gemini ${e.message} → rule-engine tool · ${tax.docType} · ${tax.category} · ${tax.ministry}` },
      { engine: 'rule', ms: 0, note: `${doc.rules.length} rules · ${doc.amounts.length} amounts · ${txl(doc.eligibility, 'en').length} eligibility clauses` },
      { engine: 'rule', ms: 0, note: `English only (translation needs the live pipeline) · guardrail ${report.passed}/${report.total} checks passed` },
    ];
    doc.source = 'heuristic';
    doc.guard = report;
  }
  doc.trace = trace;
  onStage(3, doc.source === 'gemini' ? 'gemini' : 'rule');
  return doc;
}

/* Web Crypto audit receipt */
async function generateReceiptHash(schemeId, score) {
  const raw = `${schemeId}-${Date.now()}-${score}`;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 12).toUpperCase();
  return `JS-SHA256-${hex}`;
}

  const intent = sIdx === 0 ? 'eligibility' : sIdx === 1 ? 'documents' : sIdx === 2 ? 'steps' : sIdx === 3 ? 'benefits'
    : Object.keys(QA_KEYS).find(k => QA_KEYS[k].test(ql));

const pcmToWav = (pcm, sampleRate) => {

  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));

// one request per script and voice; finished audio is reused so replays cost no quota
const ttsCache = new Map();
async function requestSpeech(apiKey, text, voiceName) {
  if (!String(apiKey || '').trim()) throw new Error('API key not added');
  let lastErr = new Error('No voice model available');
  for (const model of TTS_MODELS) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': String(apiKey || '').trim() },
          body: JSON.stringify({ contents: [{ parts: [{ text }] }], generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } } }),
          signal: ctrl.signal,
        });
        if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), { status: res.status });
        const data = await res.json();
        const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
        const audio = parts.map(p => p.inlineData).find(Boolean);
        if (!audio || !audio.data) throw new Error('No audio in response');
        const bytes = Uint8Array.from(atob(audio.data), c => c.charCodeAt(0));
        if (/wav/i.test(audio.mimeType || '')) return new Blob([bytes], { type: 'audio/wav' });
        const rate = +((String(audio.mimeType).match(/rate=(\d+)/) || [])[1]) || 24000;
        return pcmToWav(bytes, rate);
      } catch (e) {
        lastErr = e;
        if (e.status === 400 || e.status === 401 || e.status === 403) throw e;
        if (e.status !== 503 && e.status !== 500 && e.status !== 504) break;
        if (attempt === 0) await new Promise(r => setTimeout(r, 800));
      } finally {
        clearTimeout(timer);
      }
    }
  }
  throw lastErr;
}
function neuralSpeech(apiKey, text, gender) {
  const key = gender + '|' + text;
  if (ttsCache.has(key)) return ttsCache.get(key);
  const p = requestSpeech(apiKey, text, neuralVoice(gender)).then(blob => URL.createObjectURL(blob));
  p.catch(() => ttsCache.delete(key));
  ttsCache.set(key, p);
  return p;
}

const voiceScore = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0) + (/in$/i.test(v.lang || '') ? 1 : 0);
const deviceVoicesFor = (voices, lang) => (voices || [])
  .filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith(lang) && !NOVELTY_RX.test(v.name) && (lang === 'en' || voiceGender(v) !== 'male'))
  .sort((a, b) => voiceScore(b) - voiceScore(a));
function pickDeviceVoice(voices, gender, lang, chosenUri) {
  const ranked = deviceVoicesFor(voices, lang);
  const chosen = chosenUri && ranked.find(v => v.voiceURI === chosenUri);
  if (chosen) return { voice: chosen, mismatch: false };
  const same = ranked.filter(v => voiceGender(v) === gender);
  if (same.length) return { voice: same[0], mismatch: false };
  // regional lists hold no known male voice, so an unlabelled one is not a mismatch
  return { voice: ranked[0] || null, mismatch: lang === 'en' };
}

function useVoiceEngine(apiKey) {
  const canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance !== 'undefined';
  const supported = canSpeak || typeof window.Audio !== 'undefined';
  const [voices, setVoices] = useState([]);
  const [isPlaying, setIsPlaying] = useState(false);
  const [loading, setLoading] = useState(false);
  const [wordIdx, setWordIdx] = useState(0);
  const [rate, setRate] = useState(1);
  const [vol, setVol] = useState(1);
  const [muted, setMuted] = useState(false);
  const [gender, setGender] = useState(() => (lsGet('jsVoiceGender') === 'male' ? 'male' : 'female'));
  const [track, setTrack] = useState(() => (lsGet('jsVoiceTrack') === 'english' || lsGet('jsVoiceTrack') === 'regional' ? lsGet('jsVoiceTrack') : lsGet('jsLang') && lsGet('jsLang') !== 'en' ? 'regional' : 'english'));
  const [regional, setRegional] = useState(() => (['hi', 'bn', 'te', 'ta'].includes(lsGet('jsVoiceRegional')) ? lsGet('jsVoiceRegional') : ['hi', 'bn', 'te', 'ta'].includes(lsGet('jsLang')) ? lsGet('jsLang') : 'hi'));
  const [voiceSource, setVoiceSource] = useState(() => (lsGet('jsVoiceSrc') === 'gemini' ? 'gemini' : 'device'));
  const [chosenVoices, setChosenVoices] = useState(() => { try { return JSON.parse(lsGet('jsVoiceChoice') || '{}') || {}; } catch (e) { return {}; } });
  const [source, setSource] = useState({ key: '', title: '', text: '', lang: 'en' });
  const [device, setDevice] = useState(null); // set only while a device voice stands in for the neural one
  const [audioDur, setAudioDur] = useState(0);
  const maleAllowed = source.lang === 'en';
  const activeGender = maleAllowed ? gender : 'female';
  const words = useMemo(() => source.text.split(/\s+/).filter(Boolean), [source.text]);
  // transcript position: each word's share of the audio, weighted by length and sentence pauses
  const marks = useMemo(() => {
    const w = words.map(x => x.length + 2 + (/[.!?\u0964,;:]["')]*$/.test(x) ? 4 : 0));
    const total = w.reduce((a, b) => a + b, 0) || 1;
    let sum = 0;
    return w.map(x => { const at = sum / total; sum += x; return at; });
  }, [words]);

  const elRef = useRef(null);
  if (!elRef.current && typeof window.Audio !== 'undefined') elRef.current = new window.Audio();
  const R = useRef({});
  R.current = { words, marks, text: source.text, rate, vol, muted, gender: activeGender, voices, lang: source.lang, isPlaying, apiKey, voiceSource, chosenVoices };
  const run = useRef(0);
  const neural = useRef(false);
  const sync = useRef({ idx: 0, t: 0, end: 0 });
  const idxRef = useRef(0);
  const pendingPlay = useRef(false);
  const seekTimer = useRef(null);

  useEffect(() => { lsSet('jsVoiceGender', gender); }, [gender]);
  useEffect(() => { lsSet('jsVoiceTrack', track); }, [track]);
  useEffect(() => { lsSet('jsVoiceRegional', regional); }, [regional]);
  useEffect(() => { lsSet('jsVoiceSrc', voiceSource); }, [voiceSource]);
  useEffect(() => { lsSet('jsVoiceChoice', JSON.stringify(chosenVoices)); }, [chosenVoices]);
  useEffect(() => {
    const el = elRef.current;
    const onEnd = () => { if (neural.current) { neural.current = false; setIsPlaying(false); setIdx(0); } };
    if (el) el.addEventListener('ended', onEnd);
    if (!canSpeak) return () => { if (el) el.removeEventListener('ended', onEnd); };
    const load = () => setVoices(window.speechSynthesis.getVoices());
    load();
    window.speechSynthesis.onvoiceschanged = load;
    return () => { if (el) el.removeEventListener('ended', onEnd); window.speechSynthesis.onvoiceschanged = null; window.speechSynthesis.cancel(); };
  }, []);

  const wps = WPS[source.lang] || 2.4;
  const dur = audioDur ? audioDur / rate : words.length ? words.length / (wps * rate) : 0;
  const pos = words.length ? (wordIdx < marks.length ? marks[wordIdx] : 1) * dur : 0;

  const setIdx = i => { idxRef.current = i; setWordIdx(i); };
  const halt = () => {
    run.current++;
    neural.current = false;
    if (canSpeak) window.speechSynthesis.cancel();
    if (elRef.current) elRef.current.pause();
    setLoading(false);
  };

  const speakOnDevice = (from, my) => {
    if (!canSpeak) { setIsPlaying(false); return; }
    const W = R.current.words;
    // sentence-sized chunks keep Chrome from truncating long utterances
    const chunks = [];
    let cur = null;
    for (let i = from; i < W.length; i++) {
      if (!cur) cur = { start: i, words: [] };
      cur.words.push(W[i]);
      if (/[.!?\u0964]["')]*$/.test(W[i]) || cur.words.length >= 26) { chunks.push(cur); cur = null; }
    }
    if (cur) chunks.push(cur);
    const pick = pickDeviceVoice(R.current.voices, R.current.gender, R.current.lang, R.current.chosenVoices[R.current.lang]);
    if (!pick.voice && R.current.voices.length) { setIsPlaying(false); return; }
    // the "stand-in" notice only applies when Gemini was the voice asked for
    setDevice(R.current.voiceSource === 'device' ? null : { name: pick.voice ? pick.voice.name : 'System default', mismatch: pick.mismatch });
    const speak = ci => {
      if (run.current !== my) return;
      if (ci >= chunks.length) { setIsPlaying(false); setIdx(0); return; }
      const c = chunks[ci];
      const offs = [];
      let o = 0;
      c.words.forEach(w => { offs.push(o); o += w.length + 1; });
      const u = new SpeechSynthesisUtterance(c.words.join(' '));
      if (pick.voice) { u.voice = pick.voice; u.lang = pick.voice.lang; } else u.lang = LANG_TAG[R.current.lang] || 'en-US';
      u.rate = R.current.rate;
      u.volume = R.current.muted ? 0 : R.current.vol;
      sync.current = { idx: c.start, t: performance.now(), end: c.start + c.words.length - 1 };
      setIdx(c.start);
      u.onboundary = e => {
        if (run.current !== my || (e.name && e.name !== 'word')) return;
        let k = 0;
        while (k + 1 < offs.length && offs[k + 1] <= e.charIndex) k++;
        sync.current.idx = c.start + k;
        sync.current.t = performance.now();
        setIdx(c.start + k);
      };
      u.onend = () => { if (run.current === my) speak(ci + 1); };
      u.onerror = e => { if (run.current !== my || e.error === 'interrupted' || e.error === 'canceled') return; speak(ci + 1); };
      window.speechSynthesis.speak(u);
    };
    setTimeout(() => speak(0), 60);
  };

  const play = useCallback((from = 0) => {
    const W = R.current.words;
    if (!W.length) return;
    halt();
    const my = run.current;
    const el = elRef.current;
    from = clamp(from, 0, W.length - 1);
    setIsPlaying(true);
    setIdx(from);
    sync.current = { idx: from, t: performance.now(), end: from };
    if (!el || R.current.voiceSource === 'device') { speakOnDevice(from, my); return; }
    // starting silent audio inside the click keeps the browser from blocking playback after the wait
    el.src = SILENT_URL;
    el.play().catch(() => {});
    setLoading(true);
    neuralSpeech(R.current.apiKey, R.current.text, R.current.gender).then(url => new Promise((resolve, reject) => {
      if (run.current !== my) return resolve(false);
      el.onloadedmetadata = () => resolve(true);
      el.onerror = () => reject(new Error('Audio could not load'));
      el.src = url;
      el.load();
    })).then(ready => {
      if (!ready || run.current !== my) return;
      el.onerror = null;
      el.currentTime = (R.current.marks[from] || 0) * el.duration;
      el.playbackRate = R.current.rate;
      el.volume = R.current.muted ? 0 : R.current.vol;
      neural.current = true;
      setDevice(null);
      setAudioDur(el.duration);
      setLoading(false);
      return el.play();
    }).catch(e => {
      if (run.current !== my) return;
      neural.current = false;
      setLoading(false);
      if (e && e.name === 'NotAllowedError') { setIsPlaying(false); return; }
      console.warn('Neural voice unavailable, using a device voice:', e && e.message);
      speakOnDevice(from, my);
    });
  }, []);

  // keeps the transcript in step with the audio
  useEffect(() => {
    if (!isPlaying) return;
    const id = setInterval(() => {
      const el = elRef.current;
      if (neural.current && el && el.duration) {
        const f = el.currentTime / el.duration;
        const M = R.current.marks;
        let k = idxRef.current;
        if (k < M.length && M[k] > f) k = 0;
        while (k + 1 < M.length && M[k + 1] <= f) k++;
        if (k !== idxRef.current) setIdx(k);
        return;
      }
      // device voices that never fire boundary events
      const s = sync.current;
      const est = s.idx + Math.floor(((performance.now() - s.t) / 1000) * (WPS[R.current.lang] || 2.4) * R.current.rate);
      const v = Math.min(est, s.end);
      if (v > idxRef.current) setIdx(v);
    }, 120);
    return () => clearInterval(id);
  }, [isPlaying]);

  // speed and volume apply live to neural audio; a device voice has to restart from the current word
  const mounted = useRef(false);
  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; }
    if (neural.current && elRef.current) {
      elRef.current.playbackRate = rate;
      elRef.current.volume = muted ? 0 : vol;
      return;
    }
    if (!R.current.isPlaying || loading) return;
    const id = setTimeout(() => play(idxRef.current), 220);
    return () => clearTimeout(id);
  }, [rate, vol, muted]);

  // a new voice or script starts from the neural voice again, with its own duration
  useEffect(() => { setDevice(null); setAudioDur(0); }, [activeGender, source.text, voiceSource]);
  const genderMounted = useRef(false);
  useEffect(() => {
    if (!genderMounted.current) { genderMounted.current = true; return; }
    if (R.current.isPlaying) play(idxRef.current);
  }, [activeGender, voiceSource, chosenVoices[source.lang]]);

  useEffect(() => {
    if (pendingPlay.current) { pendingPlay.current = false; play(0); }
  }, [source]);

  const pause = () => { halt(); setIsPlaying(false); };
  const toggle = () => (R.current.isPlaying ? pause() : play(idxRef.current >= R.current.words.length - 1 ? 0 : idxRef.current));
  const seekWord = i => {
    const n = R.current.words.length;
    if (!n) return;
    i = clamp(Math.round(i), 0, n - 1);
    setIdx(i);
    const el = elRef.current;
    if (neural.current && el && el.duration) { el.currentTime = (R.current.marks[i] || 0) * el.duration; return; }
    if (R.current.isPlaying) { clearTimeout(seekTimer.current); seekTimer.current = setTimeout(() => play(i), 200); }
  };
  const seekTo = sec => { if (dur) { const f = sec / dur; let k = 0; while (k + 1 < marks.length && marks[k + 1] <= f) k++; seekWord(k); } };
  const skip = d => seekTo(pos + d);
  const restart = () => play(0);
  const loadSource = (src, autoplay) => {
    halt();
    setIsPlaying(false);
    setIdx(0);
    pendingPlay.current = !!autoplay;
    setSource({ ...src });
  };

  // choosing male or female returns to the best automatic voice; choosing a voice sets the matching gender
  const chooseGender = g => { setChosenVoices(c => { const n = { ...c }; delete n[R.current.lang]; return n; }); setGender(g); };
  const chooseDeviceVoice = uri => {
    setChosenVoices(c => { const n = { ...c }; if (uri) n[R.current.lang] = uri; else delete n[R.current.lang]; return n; });
    const v = (R.current.voices || []).find(x => x.voiceURI === uri);
    const g = v && voiceGender(v);
    if (g && R.current.lang === 'en') setGender(g);
  };
  const devicePick = pickDeviceVoice(voices, activeGender, source.lang, chosenVoices[source.lang]);
  const usingDevice = voiceSource === 'device';
  const voiceNote = usingDevice
    ? (voices.length && !devicePick.voice ? 'voiceNone' : voices.length && devicePick.mismatch ? 'voiceNoMatch' : '')
    : device ? (device.mismatch ? 'voiceMismatch' : 'voiceBackup') : '';

  return {
    supported, voices, isPlaying, loading, wordIdx, words, pos, dur, rate, setRate, vol, setVol, muted, setMuted,
    gender: activeGender, setGender: chooseGender, maleAllowed, voiceSource, setVoiceSource, chooseDeviceVoice, voiceNote, chosenVoice: chosenVoices[source.lang] || '',
    deviceOptions: deviceVoicesFor(voices, source.lang).map(v => ({ uri: v.voiceURI, name: v.name, lang: v.lang, gender: voiceGender(v), hq: HIGH_QUALITY_RX.test(v.name) })),
    track, setTrack, regional, setRegional, source, loadSource, play, pause, toggle, seekTo, seekWord, skip, restart,
    voiceName: usingDevice ? (devicePick.voice ? devicePick.voice.name : 'System default') : device ? device.name : `Gemini · ${neuralVoice(activeGender)}`,
  };
}

const Equalizer = ({ on, color = '#30d158', h = 16 }) => (
  <span className={`flex items-end gap-[2px] ${on ? 'eq-on' : ''}`} style={{ height: h }} aria-hidden="true">
    {[0, 1, 2, 3].map(i => <span key={i} className="eq-bar w-[3px] rounded-full" style={{ height: h, background: color }} />)}
  </span>
);

const PlayGlyph = ({ audio, active = true, size, playClass }) => (active && audio.loading ? <Loader size={size} className="animate-spin" />
  : active && audio.isPlaying ? <Pause size={size} fill="currentColor" /> : <Play size={size} fill="currentColor" className={playClass} />);
const VoiceStatus = ({ audio, t }) => (audio.voiceNote
  ? <div className="mt-1.5 text-[11px] leading-snug text-[#c27400] dark:text-[#ffb340]">{t(audio.voiceNote)}</div> : null);

const Switch = ({ on, onChange, label }) => (
  <button type="button" role="switch" aria-checked={on} aria-label={label} onClick={() => onChange(!on)}
    className={`relative w-11 h-6 rounded-full transition-colors duration-300 shrink-0 ${on ? 'bg-emerald-500' : 'bg-zinc-300 dark:bg-white/[0.16]'}`}>
    <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow-[0_2px_6px_rgba(0,0,0,0.3)] transition-transform duration-300 ${on ? 'translate-x-5' : ''}`} />
  </button>
);

const Range = ({ value, min = 0, max = 1, step = 0.01, onChange, fill = '#0a84ff', label }) => {
  const p = max > min ? ((value - min) / (max - min)) * 100 : 0;
  return <input type="range" aria-label={label} className="ios-range" min={min} max={max} step={step} value={value}
    onChange={e => onChange(parseFloat(e.target.value))} style={{ '--p': `${clamp(p, 0, 100)}%`, '--fill': fill }} />;
};

const CardHead = ({ Icon, title, color, right }) => (
  <div className="flex items-center justify-between gap-3 mb-4">
    <div className="flex items-center gap-2.5 min-w-0">
      <span className="w-8 h-8 rounded-[10px] grid place-items-center shrink-0" style={{ background: color + '22', color }}><Icon size={16} strokeWidth={2.2} /></span>
      <h3 className={`text-[15px] font-semibold tracking-[-0.01em] ${T1} truncate`}>{title}</h3>
    </div>
    {right}
  </div>
);

const SourceBadge = ({ doc, t }) => {
  if (doc.source === 'heuristic') return <span className="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-1 rounded-full bg-[#ff9f0a]/15 text-[#c27400] dark:text-[#ffb340]">{t('localEngine')}</span>;
  if (doc.source === 'gemini') return <span className="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-1 rounded-full bg-[#5e5ce6]/15 text-[#4b49c9] dark:text-[#a5a4ff]">{t('viaEngine')}</span>;
  if (doc.source === 'ogd') return <span className="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-1 rounded-full bg-[#0a84ff]/15 text-[#0a84ff]">{t('ogdPill')}</span>;
  return <span className={`inline-flex items-center gap-1 text-[11px] font-medium px-2 py-1 rounded-full ${CHIP} ${T2}`}><Check size={11} /> {t('curated')}</span>;
};

const STREAMS = [['scheme', 'streamScheme'], ['notification', 'streamNotif'], ['bylaw', 'streamBylaw'], ['policy', 'streamPolicy'], ['all', 'streamAll']];

function DeadlinePill({ doc, lang, t, small }) {
  if (!doc.deadline) return <span className={`inline-flex items-center text-[12px] font-medium px-2.5 py-1 rounded-full ${CHIP} ${T3}`}>{t('dlNone')}</span>;
  const n = daysLeft(doc.deadline);
  const date = localDate(doc.deadline, lang);
  if (n < 0) return <span className={`inline-flex items-center gap-1 ${small ? 'text-[11px]' : 'text-[12.5px]'} font-medium px-2.5 py-1 rounded-full ${CHIP} ${T2}`}>🔒 {t('dlClosed').replace('{d}', date)}</span>;
  return (
    <span className={`inline-flex items-center gap-1 ${small ? 'text-[11px]' : 'text-[13px]'} font-semibold px-3 py-1.5 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300 ring-1 ring-inset ring-amber-500/70 shadow-[0_0_22px_rgba(245,158,11,0.35)]`}>
      ⏳ {t('dlCloses').replace('{d}', date)} · {n === 0 ? t('dlToday') : t('dlDays').replace('{n}', n)}
    </span>
  );
}

function FeatureRow({ title, items, lang, t, onOpen, onLetter }) {
  if (!items.length) return null;
  return (
    <section className="mb-6">
      <h2 className={`text-[15px] font-semibold tracking-[-0.01em] mb-3 ${T1}`}>{title}</h2>
      <div className="flex gap-3 overflow-x-auto no-scrollbar pb-2 -mx-4 px-4 sm:mx-0 sm:px-0 snap-x">
        {items.map(d => {
          const D = DOC_TYPES[d.docType] || DOC_TYPES.scheme;
          return (
            <div key={d.id} className="snap-start shrink-0 w-[300px] p-4 rounded-[20px] flex flex-col gap-2.5 bg-white/70 dark:bg-white/[0.04] ring-1 ring-inset ring-black/[0.06] dark:ring-white/[0.08]">
              <span className="self-start text-[10.5px] font-semibold px-2 py-0.5 rounded-full" style={{ background: D.color + '1f', color: D.color }}>{tx(D.label, lang)}</span>
              <button onClick={() => onOpen(d.id)} className={`text-left text-[14.5px] font-semibold leading-snug hover:text-[#0a84ff] transition ${T1}`}>{tx(d.name, lang)}</button>
              <p className={`text-[12.5px] leading-relaxed line-clamp-2 ${T2}`}>{tx(d.summary, lang)}</p>
              {d.docType !== 'bylaw' && <div><DeadlinePill doc={d} lang={lang} t={t} small /></div>}
              {d.docType === 'bylaw' && d.amounts.length > 0 && <div className="flex flex-wrap gap-1.5">{d.amounts.slice(0, 2).map((a, i) => <span key={i} className={`text-[11.5px] font-semibold px-2 py-1 rounded-lg ${CHIP} ${T1}`}>{a}</span>)}</div>}
              <div className="mt-auto flex flex-wrap gap-2 pt-1">
                <button onClick={() => onOpen(d.id)} className={`${BTN_SOFT} !py-1.5 !text-[12px]`}>{t('viewDetails')}</button>
                {d.docType === 'policy' && <button onClick={() => onLetter(d)} className={`${BTN_SOFT} !py-1.5 !text-[12px]`}>✍️ {t('feedbackBtn')}</button>}
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

const FILTER_KEYS = ['all', 'agri', 'edu', 'health', 'biz', 'house', 'legal'];
const searchHay = (d, lang) => [

  CATS[d.category] ? Object.values(CATS[d.category].label).join(' ') : '', d.docType,

  const shell = active
    ? 'bg-white dark:bg-white/[0.09] ring-2 ring-inset ring-amber-500/80 shadow-[0_0_25px_rgba(245,158,11,0.25)]'
    : 'bg-white/70 dark:bg-white/[0.04] ring-1 ring-inset ring-black/[0.06] dark:ring-white/[0.08] hover:bg-white dark:hover:bg-white/[0.07] hover:shadow-[0_14px_40px_-18px_rgba(0,0,0,0.5)]';
  return (

      {d.deadline && <div className="mt-2.5"><DeadlinePill doc={d} lang={lang} t={t} small /></div>}

/* ------------------------------------------------------------------ *

function VoiceCard({ audio, t, lang, docKey }) {
  const box = useRef(null);
  const activeEl = useRef(null);
  const isDocSource = audio.source.key === docKey;
  useEffect(() => {
    const b = box.current, a = activeEl.current;
    if (!b || !a) return;
    const top = a.offsetTop;
    if (top < b.scrollTop + 8 || top > b.scrollTop + b.clientHeight - 36) b.scrollTo({ top: Math.max(0, top - 36), behavior: 'smooth' });
  }, [audio.wordIdx]);
  const started = audio.isPlaying || audio.wordIdx > 0;
  return (
    <div className={`${GLASS} p-5 flex flex-col`}>
      <CardHead Icon={Headphones} title={t('explainer')} color="#0a84ff" right={<Equalizer on={audio.isPlaying} color="#0a84ff" />} />
      <div className="flex items-center gap-3">
        <button onClick={audio.toggle} disabled={!audio.supported} aria-label={audio.isPlaying ? t('pause') : t('listen')}
          className="w-12 h-12 rounded-full bg-[#0a84ff] text-white grid place-items-center shadow-[0_8px_24px_-6px_rgba(10,132,255,0.8)] active:scale-95 transition shrink-0">
          <PlayGlyph audio={audio} size={20} playClass="ml-0.5" />
        </button>
        <div className="flex-1 min-w-0">
          <div className={`text-[13px] font-medium truncate ${T1}`}>{isDocSource ? t('explainer') : audio.source.title}</div>
          <div className="flex items-center gap-2 mt-1.5">
            <span className={`text-[11px] tabular-nums ${T3}`}>{fmt(audio.pos)}</span>
            <div className="flex-1"><Range label="Timeline" value={audio.pos} max={audio.dur || 1} step={0.1} onChange={audio.seekTo} /></div>
            <span className={`text-[11px] tabular-nums ${T3}`}>{fmt(audio.dur)}</span>
          </div>
        </div>
      </div>
      <div className={`mt-2 text-[11px] truncate ${T3}`}>🎙 {audio.gender === 'male' ? t('voiceMale') : t('voiceFemale')} · {audio.loading ? t('voiceLoading') : audio.voiceName}</div>
      <VoiceStatus audio={audio} t={t} />
      {!audio.supported && <div className="mt-3 text-[12px] text-[#ff9f0a]">{t('noSpeech')}</div>}
      <div className="mt-4 flex items-center justify-between">
        <span className={`text-[11px] font-semibold uppercase tracking-[0.08em] ${T3}`}>{t('transcript')}</span>
        <span className={`text-[11px] ${T3}`}>{t('tapWord')}</span>
      </div>
      <div ref={box} className={`relative mt-2 max-h-[190px] overflow-y-auto thin-scroll rounded-2xl p-3.5 text-[15px] leading-[1.75] ${CHIP}`}>
        {audio.words.map((w, i) => {
          const cur = started && i === audio.wordIdx;
          return (
            <span key={i} ref={cur ? activeEl : null} onClick={() => audio.isPlaying ? audio.seekWord(i) : audio.play(i)}
              className={`cursor-pointer rounded-[6px] px-[2px] transition-colors duration-150 ${cur ? 'bg-[#0a84ff] text-white' : started && i < audio.wordIdx ? T1 : started ? 'text-zinc-400 dark:text-white/35' : T2} hover:bg-[#0a84ff]/15`}>{w} </span>
          );
        })}
      </div>
      {audio.track === 'regional' && audio.source.lang === 'en' && audio.source.key.startsWith('doc:') && <div className={`mt-2 text-[11px] ${T3}`}>{t('narrEn')}</div>}
    </div>
  );
}

/* ------------------------------------------------------------------ *
 * "Do I qualify?" — evaluates dynamic JSON rule objects
 * ------------------------------------------------------------------ */
function RuleSimulator({ doc, lang, t, rules, setRules }) {
  const items = rulesFor(doc);
  const state = rules[doc.id] || {};
  const set = (i, v) => setRules(r => ({ ...r, [doc.id]: { ...(r[doc.id] || {}), [i]: v } }));
  // bylaw and policy lists describe who is affected: any one of them is enough
  const anyMode = doc.docType === 'bylaw' || doc.docType === 'policy';
  const pct = anyMode ? (items.some((r, i) => ruleMet(r, state[i])) ? 100 : 0) : ruleScore(items, state);
  const color = pct === 100 ? '#30d158' : pct >= 50 ? '#ff9f0a' : '#ff453a';
  const R = 34, C = 2 * Math.PI * R;
  const missing = items.filter((r, i) => !ruleMet(r, state[i])).map(r => tx(r.label, lang));
  const fieldLabel = r => ({ income: t('yourIncome'), age: t('yourAge'), land: t('yourLand') }[r.field] || t('yourValue'));
  const bound = r => `${r.type === 'max' ? '≤' : '≥'} ${r.unit === '₹' ? '₹' + Number(r.value).toLocaleString('en-IN') : r.value + (r.unit ? ' ' + r.unit : '')}`;
  return (
    <div className={`${GLASS} p-5`}>
      <CardHead Icon={UserCheck} title={doc.docType === 'scheme' ? t('simulator') : t('simApply')} color="#30d158" />
      <div className="flex items-center gap-5 mb-4">
        <div className="relative w-[84px] h-[84px] shrink-0">
          <svg viewBox="0 0 84 84" className="w-full h-full -rotate-90">
            <circle cx="42" cy="42" r={R} fill="none" strokeWidth="8" className="stroke-black/[0.07] dark:stroke-white/[0.08]" />
            <circle cx="42" cy="42" r={R} fill="none" strokeWidth="8" stroke={color} strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C - (C * pct) / 100} style={{ transition: 'stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1), stroke .3s' }} />
          </svg>
          <div className="absolute inset-0 grid place-items-center">
            <span className={`text-[20px] font-semibold tabular-nums ${T1}`}>{pct}%</span>
          </div>
        </div>
        <div className="min-w-0">
          <div className={`text-[13px] font-semibold ${T1}`}>{t('readiness')}</div>
          <div className={`text-[12px] mt-0.5 ${T3}`}>{t('simHint')}</div>
          {pct === 100
            ? <div className="mt-2 text-[12px] font-medium text-emerald-600 dark:text-[#30d158] flex items-start gap-1.5"><CheckCircle size={14} className="mt-0.5 shrink-0" />{anyMode ? t('simApplies') : t('allMet')}</div>
            : !anyMode && <div className="mt-2 text-[12px] font-medium" style={{ color }}>{t('missing')}: {missing.length}</div>}
        </div>
      </div>
      <div className="rounded-2xl overflow-hidden divide-y divide-black/[0.06] dark:divide-white/[0.07] bg-white/60 dark:bg-white/[0.035]">
        {items.map((r, i) => {
          const label = tx(r.label, lang);
          if (r.type === 'bool') return (
            <label key={i} className="flex items-center justify-between gap-3 px-4 py-3 cursor-pointer">
              <span className={`text-[13.5px] leading-snug ${state[i] === true ? T1 : T2}`}>{label}</span>
              <Switch on={state[i] === true} label={label} onChange={v => set(i, v)} />
            </label>
          );
          const v = typeof state[i] === 'string' ? state[i] : '';
          const ok = ruleMet(r, v);
          return (
            <div key={i} className="px-4 py-3">
              <div className={`text-[13.5px] leading-snug ${ok ? T1 : T2}`}>{label}</div>
              <div className="mt-2 flex items-center gap-2">
                <input type="number" inputMode="decimal" min="0" value={v} onChange={e => set(i, e.target.value)} placeholder={fieldLabel(r)} aria-label={fieldLabel(r)}
                  className={`flex-1 min-w-0 rounded-xl px-3 py-2 text-[13.5px] tabular-nums outline-none focus:ring-2 focus:ring-inset focus:ring-[#0a84ff]/60 ${CHIP} ${T1} placeholder:text-zinc-400 dark:placeholder:text-white/35`} />
                <span className={`shrink-0 text-[12px] font-semibold font-mono px-2 py-1.5 rounded-lg ${CHIP} ${T2}`}>{bound(r)}</span>
                <span className="w-5 shrink-0">{v !== '' && (ok ? <CheckCircle size={18} className="text-emerald-600 dark:text-[#30d158]" /> : <X size={18} className="text-[#ff453a]" />)}</span>
              </div>
            </div>
          );
        })}
      </div>
      {!anyMode && pct < 100 && missing.length > 0 && (
        <ul className="mt-3 space-y-1">
          {missing.slice(0, 3).map((m, i) => <li key={i} className="text-[12px] flex gap-1.5 text-[#d63a30] dark:text-[#ff6961]"><X size={13} className="mt-0.5 shrink-0" />{m}</li>)}
        </ul>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ *
 * Q&A assistant
 * ------------------------------------------------------------------ */
function QAAssistant({ doc, lang, t, apiKey, audio, onEngine }) {
  const [threads, setThreads] = useState({});
  const [q, setQ] = useState('');
  const [busy, setBusy] = useState(false);
  const listRef = useRef(null);
  const msgs = threads[doc.id] || [];
  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [msgs.length, busy]);
  const send = async text => {
    const question = (text || q).trim();
    if (!question || busy) return;
    setQ('');
    const userMsg = { role: 'user', text: question, lang };
    setThreads(th => ({ ...th, [doc.id]: [...(th[doc.id] || []), userMsg] }));
    setBusy(true);
    onEngine('busy');
    const ans = await askQA(apiKey, doc, question, lang, msgs);
    if (ans.source !== 'card') onEngine(ans.source === 'gemini' ? 'ok' : 'fallback'); else onEngine('idle');
    const msg = { role: 'ai', text: ans.text, source: ans.source, lang, id: Date.now() };
    setThreads(th => ({ ...th, [doc.id]: [...(th[doc.id] || []), msg] }));
    setBusy(false);
  };
  return (
    <div className={`${GLASS} p-5 flex flex-col`}>
      <CardHead Icon={Bot} title={t('ask')} color="#5e5ce6" right={<span className={`text-[11px] ${T3}`}>⚡ {ENGINE_LABEL}</span>} />
      <div ref={listRef} className="flex-1 min-h-[140px] max-h-[300px] overflow-y-auto thin-scroll space-y-2.5 pr-1">
        {!msgs.length && (
          <div className="flex flex-wrap gap-2">
            {UI[lang].suggest.map(s => <button key={s} onClick={() => send(s)} className={`${BTN_SOFT} !py-1.5 !text-[12.5px]`}>{s}</button>)}
          </div>
        )}
        {msgs.map((m, i) => m.role === 'user' ? (
          <div key={i} className="flex justify-end"><div className="max-w-[85%] bg-[#0a84ff] text-white text-[13.5px] px-3.5 py-2 rounded-[18px] rounded-br-md">{m.text}</div></div>
        ) : (
          <div key={i} className="flex justify-start rise">
            <div className={`max-w-[90%] text-[13.5px] leading-relaxed px-3.5 py-2.5 rounded-[18px] rounded-bl-md ${CHIP} ${T1}`}>
              <div>{m.text}</div>
              <div className="flex items-center gap-2 mt-2">
                <button onClick={() => { const key = 'qa:' + m.id; if (audio.source.key === key && audio.isPlaying) audio.pause(); else audio.loadSource({ key, title: 'Q&A · ' + tx(doc.name, lang), text: m.text, lang: m.lang }, true); }}
                  className="inline-flex items-center gap-1 text-[11.5px] font-medium text-[#0a84ff]">
                  {audio.source.key === 'qa:' + m.id && audio.isPlaying ? <><Pause size={12} /> {t('pause')}</> : <><Volume2 size={12} /> {t('listen')}</>}
                </button>
                <span className={`text-[10.5px] ${T3}`}>{m.source === 'gemini' ? t('viaEngine') : m.source === 'card' ? t('fromCard') : t('localEngine')}</span>
              </div>
            </div>
          </div>
        ))}
        {busy && <div className={`flex items-center gap-2 text-[12.5px] ${T3}`}><Loader size={14} className="animate-spin" /> {t('thinking')}</div>}
      </div>
      <form onSubmit={e => { e.preventDefault(); send(); }} className={`mt-3 flex items-center gap-2 rounded-full pl-4 pr-1.5 py-1.5 ${CHIP}`}>
        <input value={q} onChange={e => setQ(e.target.value)} placeholder={t('askPh')} className={`flex-1 min-w-0 bg-transparent outline-none text-[14px] ${T1} placeholder:text-zinc-400 dark:placeholder:text-white/35`} />
        <button type="submit" disabled={!q.trim() || busy} aria-label="Send" className="w-8 h-8 rounded-full bg-[#0a84ff] text-white grid place-items-center disabled:opacity-40"><Send size={14} /></button>
      </form>
    </div>
  );
}

/* mammoth.js is lazy-loaded only when a DOCX is uploaded */

// Stage markers advance only when a real pipeline stage starts or finishes
function ProgressTracker({ t, job, reading }) {
  const labels = t('stages');
  const stage = job ? job.stage : -1;
  const engines = (job && job.engines) || [];
  return (
    <div className={`${GLASS} p-5`}>
      <CardHead Icon={Sparkles} title={t('trace')} color="#5e5ce6" right={stage >= 0 && stage < 3 ? <Loader size={15} className="animate-spin text-[#5e5ce6]" /> : null} />
      <ol className="space-y-1 font-mono">
        {labels.map((l, i) => {
          const st = stage > i ? 'done' : stage === i ? 'active' : 'pending';
          const eng = engines[i];
          return (
            <li key={i} className={`flex items-start gap-2.5 px-3 py-2.5 rounded-xl transition ${st === 'active' ? 'bg-[#5e5ce6]/10 ring-1 ring-inset ring-[#5e5ce6]/40' : ''}`}>
              <span className={`text-[13px] font-bold shrink-0 ${st === 'done' ? 'text-emerald-600 dark:text-[#30d158]' : st === 'active' ? 'text-[#5e5ce6]' : T3}`}>{st === 'done' ? '[✓]' : st === 'active' ? '[…]' : '[ ]'}</span>
              <span className="min-w-0 font-sans">
                <span className={`block text-[13.5px] ${st === 'pending' ? T3 : T1} ${st === 'active' ? 'font-semibold' : ''}`}>{l}</span>
                {eng && <span className={`block text-[11px] mt-0.5 ${eng === 'gemini' ? 'text-[#5e5ce6] dark:text-[#a5a4ff]' : 'text-[#c27400] dark:text-[#ffb340]'}`}>{eng === 'gemini' ? t('viaEngine') : t('localEngine')}</span>}
              </span>
            </li>
          );
        })}
      </ol>
      <div className={`mt-3 text-[12px] leading-relaxed ${T3}`}>{stage < 0 && !reading ? t('idleTracker') : ''}</div>
    </div>
  );
}

// Live Data.gov.in catalogue: real published records, loaded into the editor for the agent pipeline
function OgdPanel({ t, disabled, onLoad }) {
  const [q, setQ] = useState('');

// WhatsApp hand-offs can fail or cut off long links, and non-Latin text takes 9 URL characters per letter:
// fill a fixed link budget by priority, then render the chosen parts in reading order
const WA_LINK_BUDGET = 2000;
const waHref = text => 'https://wa.me/?text=' + encodeURIComponent(text);
function buildWhatsApp(doc, lang, t, trackId, checked) {
  const summary = String(tx(doc.summary, lang) || '');
  const steps = txl(doc.steps, lang);
  const render = list => [...list].sort((a, b) => a.at - b.at).map(p => p.text).join('\n\n');
  const fits = list => waHref(render(list)).length <= WA_LINK_BUDGET;
  const fee = { at: 9, text: `⚠️ ${t('zeroFee')}: ₹0 · 14555 / CPGRAMS` };
  // always sent: identity, official portal and the anti-bribery warning
  const chosen = [{ at: 0, text: '*JanSetu AI*' }, { at: 1, text: `*${tx(doc.name, lang)}*` }, { at: 7, text: `${t('portal')}: ${doc.portal}` }, ...(doc.docType === 'scheme' ? [fee] : [])];
  let complete = true;
  // the summary is cut at a word boundary rather than dropped
  const words = summary.split(/\s+/).filter(Boolean);
  for (let n = words.length; n > 0; n--) {
    const text = n === words.length ? summary : words.slice(0, n).join(' ') + '…';
    if (fits([...chosen, { at: 2, text }])) { chosen.push({ at: 2, text }); if (n < words.length) complete = false; break; }
    if (n === 1) complete = false;
  }
  [
    { at: 8, text: doc.helpline ? `${t('helpline')}: ${doc.helpline}` : '' },
    { at: 3, text: doc.amounts.length ? doc.amounts.join(' · ') : '' },
    { at: 5, text: steps.length ? `*${bentoTitle(doc, t, 3)}*\n${steps.map((s, i) => `${i + 1}. ${s}`).join('\n')}` : '' },
    { at: 4, text: doc.documents.length ? `*${bentoTitle(doc, t, 2)}*\n${doc.documents.map((d, i) => `${checked[i] ? '[x]' : '[ ]'} ${d}`).join('\n')}` : '' },
    { at: 10, text: `${t('trackId')}: ${trackId}` },
  ].filter(p => p.text).forEach(p => { if (fits([...chosen, p])) chosen.push(p); else complete = false; });
  // room left: upgrade to the full zero-fee sentence
  const full = `⚠️ ${tx(ZERO_FEE, lang)}`;
  const swapped = chosen.map(p => (p === fee ? { at: 9, text: full } : p));
  if (fits(swapped)) return { text: render(swapped), complete };
  return { text: render(chosen), complete: false };
}

function buildBrief(doc, lang, t, trackId, checked) {
  const docs = doc.documents.map((d, i) => `${checked[i] ? '[x]' : '[ ]'} ${d}`).join('\n');
  const steps = txl(doc.steps, lang).map((s, i) => `${i + 1}. ${s}`).join('\n');
  const ready = doc.documents.filter((_, i) => checked[i]).length;
  return [
    `*JanSetu AI — Citizen Brief*`,
    `${t('trackId')}: ${trackId}`,
    ``,
    `*${tx(doc.name, lang)}*`,
    tx(doc.summary, lang),
    doc.amounts.length ? `\n${doc.amounts.join(' · ')}` : '',
    ``,
    `*${bentoTitle(doc, t, 2)} (${ready}/${doc.documents.length})*`,
    docs,
    ``,
    `*${bentoTitle(doc, t, 3)}*`,
    steps,
    ``,
    `${t('portal')}: ${doc.portal}`,
    doc.helpline ? `${t('helpline')}: ${doc.helpline}` : '',
    ``,
    doc.docType === 'scheme' ? `⚠️ ${tx(ZERO_FEE, lang)}` : '',
  ].filter(l => l !== null).join('\n').replace(/\n{3,}/g, '\n\n');
}
